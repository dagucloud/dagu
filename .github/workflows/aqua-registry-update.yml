name: aqua-registry-update

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve latest aqua-registry release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/aquaproj/aqua-registry/releases/latest --jq .tag_name)"
          sha="$(gh api "repos/aquaproj/aqua-registry/commits/${tag}" --jq .sha)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Update pinned registry ref
        id: update
        env:
          TAG: ${{ steps.latest.outputs.tag }}
          SHA: ${{ steps.latest.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import os
          import pathlib
          import re

          path = pathlib.Path("internal/core/tools.go")
          text = path.read_text()
          text = re.sub(r"// aqua-registry v[^\n]*", f"// aqua-registry {os.environ['TAG']}", text, count=1)
          text = re.sub(
              r'DefaultAquaStandardRegistryRef = "[0-9a-f]{40}"',
              f'DefaultAquaStandardRegistryRef = "{os.environ["SHA"]}"',
              text,
              count=1,
          )
          path.write_text(text)
          EOF
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # PRs opened with the default workflow token do not trigger CI runs;
      # close and reopen the PR (or push to its branch) to run checks.
      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail
          branch="chore/aqua-registry-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git commit -am "chore: update pinned aqua registry to ${TAG}"
          git push -fu origin "${branch}"
          gh pr create \
            --title "chore: update pinned aqua registry to ${TAG}" \
            --body "Automated weekly bump of \`DefaultAquaStandardRegistryRef\` to aqua-registry \`${TAG}\`." \
            || echo "PR already exists; branch updated."
