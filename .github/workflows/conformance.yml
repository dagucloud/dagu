name: Conformance

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/setup-go-cache/**"
      - ".github/workflows/conformance.yml"
      - "conformance/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "Makefile"
      - "scripts/ci/**"
  pull_request:
    # Keep this workflow directly rerunnable from PR-only maintenance commits.
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft # cancels the run in progress
      - labeled # the full-ci label runs the Windows, Conformance, and E2E jobs
    paths:
      - ".github/actions/setup-go-cache/**"
      - ".github/workflows/conformance.yml"
      - "conformance/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "Makefile"
      - "scripts/ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new commit to a pull request cancels the run of the commit it
  # replaces. Runs for a branch share one group and always finish: one runs
  # at a time, and a newer commit replaces the run still waiting, so a burst
  # of merges to main tests only the latest commit.
  # A run started by any label but full-ci skips every job, and its own
  # group keeps it from cancelling the run in progress.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.27.4"

jobs:
  # Linux runs for every change the triggers name, embedded assets
  # included. Windows runs only for Go code, the conformance suite, and the
  # files that build and plan it, where behavior can differ by OS.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # A pull request runs these jobs only with the full-ci label.
    if: >-
      github.event_name != 'pull_request' || (
      !github.event.pull_request.draft &&
      contains(github.event.pull_request.labels.*.name, 'full-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    outputs:
      os: ${{ steps.filter.outputs.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Choose operating systems
        id: filter
        shell: bash
        run: |
          both='["ubuntu-latest","windows-latest"]'
          base_sha=""
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # The PR merge commit's first parent is the base branch tip.
            base_sha="$(git rev-parse "${GITHUB_SHA}^1")"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            base_sha="${{ github.event.before }}"
          fi
          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]] ||
            ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            echo "os=${both}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          os='["ubuntu-latest"]'
          while IFS= read -r file; do
            case "${file}" in
              *.go|go.mod|go.sum|conformance/*|Makefile|scripts/ci/*|.github/actions/setup-go-cache/*|.github/workflows/conformance.yml)
                os="${both}"
                break
                ;;
            esac
          done <<< "$(git diff --name-only "${base_sha}" "${GITHUB_SHA}")"
          echo "os=${os}" >> "${GITHUB_OUTPUT}"

  conformance:
    name: Conformance tests (${{ matrix.os }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
        shard: [1, 2]
        shards: [2]
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: ./.github/actions/setup-go-cache
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install GNU Make
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make --no-progress -y
          }

      # Conformance fixtures spawn Windows PowerShell (powershell.exe) under a
      # bounded command-substitution timeout. The first spawn on a fresh runner
      # pays a JIT/antivirus penalty that can exceed the timeout, so pay it here
      # instead of inside a test.
      - name: Warm up Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: Write-Output warmup

      - name: Plan test shard
        shell: bash
        run: scripts/ci/go-test-suite.sh conformance "${{ matrix.shard }}" "${{ matrix.shards }}" > "${RUNNER_TEMP}/go-test-plan.tsv"

      # The -run filter goes through GOFLAGS because make would expand the $ in
      # the regexp; go commands other than go test ignore it.
      - name: Run conformance tests
        shell: bash
        run: |
          status=0
          while IFS=$'\t' read -r -u 3 packages run; do
            GOFLAGS="${run:+-run=${run}}" make conformance \
              CONFORMANCE_TEST_TARGET="${packages}" \
              GO_TEST_FLAGS="${{ runner.os == 'Windows' && '-v -p=1' || '-v --race' }}" || status=1
          done 3< "${RUNNER_TEMP}/go-test-plan.tsv"
          exit "${status}"
