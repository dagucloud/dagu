name: Conformance

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/setup-go-cache/**"
      - ".github/workflows/conformance.yml"
      - "conformance/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "Makefile"
      - "scripts/ci/**"
      - "specs/**"
  pull_request:
    # Keep this workflow directly rerunnable from PR-only maintenance commits.
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - ".github/actions/setup-go-cache/**"
      - ".github/workflows/conformance.yml"
      - "conformance/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "Makefile"
      - "scripts/ci/**"
      - "specs/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.0"

jobs:
  conformance:
    name: Conformance tests (${{ matrix.os }} ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2]
        shards: [2]
        include:
          - os: ubuntu-latest
            go_test_flags: "-v --race"
          - os: windows-latest
            go_test_flags: "-v -p=1"
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: ./.github/actions/setup-go-cache
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install GNU Make
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make --no-progress -y
          }

      # Conformance fixtures spawn Windows PowerShell (powershell.exe) under a
      # bounded command-substitution timeout. The first spawn on a fresh runner
      # pays a JIT/antivirus penalty that can exceed the timeout, so pay it here
      # instead of inside a test.
      - name: Warm up Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: Write-Output warmup

      - name: Plan test shard
        shell: bash
        run: scripts/ci/go-test-suite.sh conformance "${{ matrix.shard }}" "${{ matrix.shards }}" > "${RUNNER_TEMP}/go-test-plan.tsv"

      # The -run filter goes through GOFLAGS because make would expand the $ in
      # the regexp; go commands other than go test ignore it.
      - name: Run conformance tests
        shell: bash
        run: |
          status=0
          while IFS=$'\t' read -r -u 3 packages run; do
            GOFLAGS="${run:+-run=${run}}" make conformance \
              CONFORMANCE_TEST_TARGET="${packages}" \
              GO_TEST_FLAGS="${{ matrix.go_test_flags }}" || status=1
          done 3< "${RUNNER_TEMP}/go-test-plan.tsv"
          exit "${status}"
