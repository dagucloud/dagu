name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

# contents: write is required for GoReleaser to create the GitHub release and
# upload assets. Restrict everything else to the minimum.
permissions:
  contents: write

jobs:
  # Build release binaries
  goreleaser:
    runs-on: ubuntu-latest
    # id-token and attestations let the attest step below record build
    # provenance for the archives this job produces.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Set up NodeJS
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm

      - name: pnpm install
        run: pnpm install
        working-directory: ui

      - name: Build web UI
        run: pnpm build
        working-directory: ui

      - name: Copy web assets
        run: cp ui/dist/* ./internal/service/frontend/assets/

      - name: Clean UI dependencies
        run: rm -rf ui/node_modules

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{secrets.DAGU_GITHUB_TOKEN}}

      # Attest the archives here, from the bytes GoReleaser just built, so the
      # packslip job below links this provenance instead of attesting copies it
      # downloads back from the release. The release is already public here, so
      # a Sigstore outage must not skip the jobs that need this one.
      - name: Attest release archives
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  # The packslip is this release's signed inventory: every archive's digest and
  # the executable inside it, plus the completions and the dagu skill that match
  # this version, signed with this workflow's identity rather than a key. It
  # lets installers such as mise verify a download against dagucloud/dagu.
  # See https://packslip.dev.
  packslip:
    name: Publish packslip
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # The action checks the packslip binary only against jdx/packslip as a
      # whole, and release assets can be replaced, so pin the bytes here.
      # Bump PACKSLIP_VERSION and PACKSLIP_SHA256 with the action pin.
      - name: Install packslip
        env:
          GH_TOKEN: ${{ github.token }}
          PACKSLIP_VERSION: 1.4.0
          PACKSLIP_SHA256: a3b0038562695545109d697642035c0fe23ab3aeed28c5142136468d24020177
        run: |
          dir="${RUNNER_TEMP}/packslip-pinned"
          asset="packslip-v${PACKSLIP_VERSION}-linux-x64.tar.xz"
          gh release download "v${PACKSLIP_VERSION}" --repo jdx/packslip \
            --pattern "$asset" --dir "$dir"
          echo "${PACKSLIP_SHA256}  ${dir}/${asset}" | sha256sum --check -
          tar -xJf "${dir}/${asset}" -C "$dir" --strip-components=1

      - uses: jdx/packslip@87479dfc6443253dff69601cace5fc6ea07e6df5 # v1.4.0
        with:
          packslip-path: ${{ runner.temp }}/packslip-pinned/packslip
          download: dagu_*.tar.gz
          bin: dagu
          attest: link
          resources: |
            completion/bash,zsh,fish,powershell=exec:dagu completion {shell}
            skill/dagu=repo:skills/dagu

  # The Inno Setup compiler is Windows-only, so the installer cannot be produced
  # in the GoReleaser job. It wraps the amd64 binary that job already published,
  # so the installer and the archive ship identical bytes.
  windows-installer:
    name: Publish Windows installer
    needs: goreleaser
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download the published Windows binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Context values are passed via env so they're treated as data, not code.
          # Writing ${{ expr }} directly inside `run:` would let a crafted value
          # execute arbitrary shell commands before the runner sees the script.
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          asset="dagu_${version}_windows_amd64.tar.gz"
          mkdir -p dist
          for i in {1..30}; do
            if gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" \
              --dir dist; then
              break
            fi
            echo "Attempt ${i}/30: release asset not available yet, waiting 10 seconds..."
            sleep 10
          done
          if [ ! -f "dist/${asset}" ]; then
            echo "::error::Release asset ${asset} was not available for ${RELEASE_TAG}"
            exit 1
          fi
          tar -xzf "dist/${asset}" -C dist dagu.exe
          mv dist/dagu.exe dist/dagu-windows-amd64.exe

      - name: Build the installer
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup 6 is not preinstalled on this image; installing it."
            choco install innosetup --no-progress --yes
          }
          & $iscc /DAppVersion=$version /DBinaryPath=dist\dagu-windows-amd64.exe scripts\installer.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE."
          }

      - name: Attach the installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          installer="dist/dagu-${version}-setup.exe"
          if [ ! -f "$installer" ]; then
            echo "::error::${installer} was not produced by the Inno Setup compiler"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "$installer" \
            --repo "$GITHUB_REPOSITORY" --clobber
