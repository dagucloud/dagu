name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
    paths:
      - "api/**"
      - "*.go"
      - "**/*.go"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "Makefile"
      - "proto/**"
      - "scripts/ci/**"
      - "scripts/e2e/**"
      - "scripts/installer.cmd"
      - "scripts/installer.iss"
      - "scripts/installer.ps1"
      - "ui/**"
      - ".github/actions/setup-go-cache/**"
      - ".github/workflows/ci.yaml"
  pull_request:
    # Keep this workflow directly rerunnable from PR-only maintenance commits.
    types:
      - opened
      - reopened # new commits are pushed to the branch that the PR is based on
      - synchronize # new commits are pushed to the branch that the PR is based on
      - ready_for_review # PR is ready for review
    paths:
      - "api/**"
      - "*.go"
      - "**/*.go"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "Makefile"
      - "proto/**"
      - "scripts/ci/**"
      - "scripts/e2e/**"
      - "scripts/installer.cmd"
      - "scripts/installer.iss"
      - "scripts/installer.ps1"
      - "ui/**"
      - ".github/actions/setup-go-cache/**"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.0"
  NODE_VERSION: "20"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      e2e: ${{ steps.filter.outputs.e2e }}
      windows_installer: ${{ steps.filter.outputs.windows_installer }}
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "go=true" >> "${GITHUB_OUTPUT}"
            echo "e2e=true" >> "${GITHUB_OUTPUT}"
            echo "windows_installer=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          base_sha=""
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            echo "go=true" >> "${GITHUB_OUTPUT}"
            echo "e2e=true" >> "${GITHUB_OUTPUT}"
            echo "windows_installer=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            echo "Base commit ${base_sha} is not available locally; running CI conservatively."
            echo "go=true" >> "${GITHUB_OUTPUT}"
            echo "e2e=true" >> "${GITHUB_OUTPUT}"
            echo "windows_installer=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_files="$(git diff --name-only "${base_sha}" "${GITHUB_SHA}")"
          printf '%s\n' "${changed_files}"

          go_changed=false
          e2e_changed=false
          windows_installer_changed=false
          while IFS= read -r file; do
            case "${file}" in
              *.go|go.mod|go.sum|Makefile|scripts/ci/*|.github/actions/setup-go-cache/*|.github/workflows/ci.yaml)
                go_changed=true
                ;;
            esac

            case "${file}" in
              ui/*)
                e2e_changed=true
                ;;
            esac

            case "${file}" in
              scripts/installer.cmd|scripts/installer.iss|scripts/installer.ps1|.github/workflows/ci.yaml)
                windows_installer_changed=true
                ;;
            esac
          done <<< "${changed_files}"

          echo "go=${go_changed}" >> "${GITHUB_OUTPUT}"
          echo "e2e=${e2e_changed}" >> "${GITHUB_OUTPUT}"
          echo "windows_installer=${windows_installer_changed}" >> "${GITHUB_OUTPUT}"

  # Lint Go code
  golint:
    name: Go Linter (${{ matrix.goos }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Files behind //go:build windows are invisible to a linter running at
        # the host GOOS, so they are linted in a job of their own.
        goos: [linux, windows]
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: ./.github/actions/setup-go-cache
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting (go fmt)
        if: matrix.goos == 'linux'
        run: |
          go fmt ./...
          # Fail if formatting changed any files
          git diff --exit-code || (echo "Go files are not formatted. Please run 'make fmt'" && exit 1)

      - name: Check modernize (go fix)
        if: matrix.goos == 'linux'
        run: |
          diff=$(go fix -embedlit=false -diff ./... 2>&1) || true
          if [ -n "$diff" ]; then
            echo "Go files need modernization. Please run 'make fmt'"
            echo "$diff"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        env:
          GOOS: ${{ matrix.goos }}
        with:
          version: v2.13.0
          args: --timeout=10m

  test-ubuntu:
    name: Test on ubuntu-latest (${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: unit, shard: 1, shards: 3 }
          - { suite: unit, shard: 2, shards: 3 }
          - { suite: unit, shard: 3, shards: 3 }
          - { suite: intg, shard: 1, shards: 3 }
          - { suite: intg, shard: 2, shards: 3 }
          - { suite: intg, shard: 3, shards: 3 }
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go-cache
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Login to Docker Hub
        if: ${{ matrix.suite == 'intg' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pre-pull integration test images
        if: ${{ matrix.suite == 'intg' }}
        shell: bash
        run: |
          images=(
            "alpine:3"
            "busybox:latest"
            "redis:7-alpine"
            "bitnamilegacy/minio:2025.7.23-debian-12-r5"
          )

          for image in "${images[@]}"; do
            for attempt in 1 2 3 4; do
              if docker pull "${image}"; then
                break
              fi
              if [[ "${attempt}" -eq 4 ]]; then
                echo "failed to pull ${image}" >&2
                exit 1
              fi
              sleep "$((attempt * 5))"
            done
          done

      - name: Plan test shard
        shell: bash
        run: scripts/ci/go-test-suite.sh "${{ matrix.suite }}" "${{ matrix.shard }}" "${{ matrix.shards }}" > "${RUNNER_TEMP}/go-test-plan.tsv"

      - name: Build
        run: |
          make bin

      - name: Test
        shell: bash
        run: |
          go install gotest.tools/gotestsum
          status=0
          group=0
          while IFS=$'\t' read -r -u 3 packages run; do
            group=$((group + 1))
            args=(-v -race -count=1 -coverpkg=./... -covermode=atomic -coverprofile="coverage-${group}.out")
            if [[ -n "${run}" ]]; then
              args+=(-run "${run}")
            fi
            # shellcheck disable=SC2086 # packages is a space-separated list.
            gotestsum --format=standard-quiet -- "${args[@]}" ${packages} || status=1
          done 3< "${RUNNER_TEMP}/go-test-plan.tsv"
          { echo "mode: atomic"; tail -q -n +2 coverage-*.out; } > coverage.out
          exit "${status}"

      # One shard saves the cache that every Go job restores; it compiles the
      # binary and nearly every package with the race detector and coverage.
      - name: Save Go caches
        if: ${{ github.ref == 'refs/heads/main' && matrix.suite == 'unit' && matrix.shard == 1 }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key }}

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          flags: ubuntu-${{ matrix.suite }}
          name: ubuntu-${{ matrix.suite }}-${{ matrix.shard }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Checks that need a different toolchain setup than the test shards.
  test-compat:
    name: Test compatibility
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: ./.github/actions/setup-go-cache
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install tested OpenCode release
        run: |
          npm ci --ignore-scripts --prefix .github/opencode
          mkdir -p .github/opencode/bin
          cp .github/opencode/node_modules/opencode-linux-x64-baseline/bin/opencode .github/opencode/bin/opencode
          chmod 0755 .github/opencode/bin/opencode
          echo "${GITHUB_WORKSPACE}/.github/opencode/bin" >> "${GITHUB_PATH}"

      - name: Test managed OpenCode capabilities
        env:
          DAGU_TEST_OPENCODE_EXECUTABLE: opencode
          DAGU_TEST_OPENCODE_VERSION: 1.18.11
        run: go test ./internal/opencodehost -run '^TestRealOpenCodeCapabilities$' -count=1

      - name: Test with the legacy JSON backend
        env:
          GOEXPERIMENT: nojsonv2
        run: go test ./internal/ir/... ./internal/persis/...

      - name: Test jq on 386
        env:
          GOARCH: '386'
          CGO_ENABLED: '0'
        run: go test ./internal/runtime/builtin/jq

  e2e:
    name: E2E (${{ matrix.shard }}/${{ matrix.shard_total }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            shard_total: 3
          - shard: 2
            shard_total: 3
          - shard: 3
            shard_total: 3
    concurrency:
      group: ci-e2e-${{ github.event.pull_request.number || github.ref }}-shard-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: ./.github/actions/setup-go-cache
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E tests
        env:
          CI: "true"
          DAGU_LICENSE_PRIVKEY_B64: ${{ secrets.DAGU_LICENSE_PRIVKEY_B64 }}
          PLAYWRIGHT_FULLY_PARALLEL: "true"
          PLAYWRIGHT_TEST_ARGS: --shard=${{ matrix.shard }}/${{ matrix.shard_total }}
        run: |
          make test-e2e-build
          make test-e2e-run

  test-windows-installer:
    name: Test Windows installer
    needs: changes
    if: needs.changes.outputs.windows_installer == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Test PowerShell installer
        shell: powershell
        run: |
          $installerPath = (Resolve-Path "scripts/installer.ps1").Path
          $source = [IO.File]::ReadAllText(
            $installerPath,
            [Text.Encoding]::UTF8
          )
          $installerRepository = "${{ github.event.pull_request.head.repo.full_name }}"
          $installerRef = "${{ github.event.pull_request.head.sha }}"
          if (-not $installerRepository) {
            $installerRepository = $env:GITHUB_REPOSITORY
            $installerRef = $env:GITHUB_SHA
          }
          $installerUrl = "https://raw.githubusercontent.com/$installerRepository/$installerRef/scripts/installer.ps1"
          $originalLocalAppData = $env:LOCALAPPDATA
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "dagu-expression-home"
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\dagu"
          $daguExe = Join-Path $installDir "dagu.exe"

          try {
            if (-not [Console]::IsInputRedirected) {
              throw "The test requires a non-interactive PowerShell host."
            }
            $script:Service = "caller-script-service"
            $script:DaguHome = "caller-script-home"
            & {
              $Service = "caller-local-service"
              irm $installerUrl | iex
              if ($Service -ne "caller-local-service") {
                throw "The installer changed the caller Service variable."
              }
            }
            if ($script:Service -ne "caller-script-service") {
              throw "The installer changed the caller script Service variable."
            }
            if ($script:DaguHome -ne "caller-script-home") {
              throw "The installer changed the caller script DaguHome variable."
            }

            if (-not (Test-Path $daguExe)) {
              throw "The expression-based installer did not install dagu.exe."
            }
            & $daguExe version
            if ($LASTEXITCODE -ne 0) {
              throw "The installed Dagu binary failed its version check."
            }
          }
          finally {
            & ([scriptblock]::Create($source)) -NoPrompt -Uninstall -InstallDir $installDir
            $env:LOCALAPPDATA = $originalLocalAppData
          }
          if (Test-Path $daguExe) {
            throw "The expression-based installer did not clean up dagu.exe."
          }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installerPath `
            -NoPrompt -DryRun -Uninstall -Version latest
          if ($LASTEXITCODE -eq 0) {
            throw "The installer accepted install-only flags during uninstall."
          }

          & ([scriptblock]::Create($source)) `
            -NoPrompt -DryRun -Service no -OpenBrowser no `
            -InstallDir "$env:RUNNER_TEMP\dagu-user-install"

          & ([scriptblock]::Create($source)) `
            -NoPrompt -DryRun -Service yes -OpenBrowser no `
            -InstallDir "$env:RUNNER_TEMP\dagu-service-install"

          & ([scriptblock]::Create($source)) `
            -NoPrompt -DryRun -Uninstall `
            -InstallDir "$env:RUNNER_TEMP\dagu-uninstall"

          $serviceOnlyDir = "$env:RUNNER_TEMP\dagu-service-only"
          New-Item -ItemType Directory -Force -Path $serviceOnlyDir | Out-Null
          Set-Content -Path "$serviceOnlyDir\dagu.exe" -Value "stub"

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installerPath `
            -NoPrompt -DryRun -ServiceOnly -Service no -InstallDir $serviceOnlyDir
          if ($LASTEXITCODE -eq 0) {
            throw "-ServiceOnly was accepted without -Service yes."
          }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installerPath `
            -NoPrompt -DryRun -ServiceOnly -Service yes -Version latest -InstallDir $serviceOnlyDir
          if ($LASTEXITCODE -eq 0) {
            throw "-ServiceOnly was accepted together with -Version."
          }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installerPath `
            -NoPrompt -DryRun -ServiceOnly -Service yes `
            -InstallDir "$env:RUNNER_TEMP\dagu-service-only-missing"
          if ($LASTEXITCODE -eq 0) {
            throw "-ServiceOnly was accepted without an installed Dagu binary."
          }

          & ([scriptblock]::Create($source)) `
            -NoPrompt -DryRun -ServiceOnly -Service yes -OpenBrowser no `
            -InstallDir $serviceOnlyDir

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Inno Setup installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -o dist\dagu-windows-amd64.exe .\cmd
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup 6 is not preinstalled on this image; installing it."
            choco install innosetup --no-progress --yes
          }
          & $iscc `
            /DAppVersion=0.0.0 `
            /DBinaryPath=dist\dagu-windows-amd64.exe `
            scripts\installer.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE."
          }

      # Mirrors how the Inno Setup installer drives the script: the binary is
      # already in place and only the Windows service should be configured.
      - name: Test installer service-only mode
        shell: powershell
        run: |
          $installerPath = (Resolve-Path "scripts/installer.ps1").Path
          $installDir = "$env:RUNNER_TEMP\dagu-service-live"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          Copy-Item dist\dagu-windows-amd64.exe "$installDir\dagu.exe"
          $binaryHash = (Get-FileHash "$installDir\dagu.exe").Hash
          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installerPath `
            -NoPrompt -ServiceOnly -Service yes -ServiceScope system `
            -Port 18080 -OpenBrowser no -InstallDir $installDir
          if ($LASTEXITCODE -ne 0) {
            throw "Service-only install failed with exit code $LASTEXITCODE."
          }

          if ((Get-FileHash "$installDir\dagu.exe").Hash -ne $binaryHash) {
            throw "Service-only install replaced the existing Dagu binary."
          }
          if ([Environment]::GetEnvironmentVariable("Path", "Machine") -ne $machinePath) {
            throw "Service-only install modified the machine PATH."
          }
          $service = Get-Service -Name Dagu -ErrorAction SilentlyContinue
          if (-not $service -or $service.Status -ne "Running") {
            throw "The Dagu service is not running after a service-only install."
          }
          Invoke-WebRequest -Uri "http://127.0.0.1:18080/api/v1/health" -UseBasicParsing | Out-Null

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installerPath `
            -NoPrompt -Uninstall -ServiceOnly -InstallDir $installDir
          if ($LASTEXITCODE -ne 0) {
            throw "Service-only uninstall failed with exit code $LASTEXITCODE."
          }
          if (Get-Service -Name Dagu -ErrorAction SilentlyContinue) {
            throw "The Dagu service survived a service-only uninstall."
          }
          if (-not (Test-Path "$installDir\dagu.exe")) {
            throw "Service-only uninstall removed the Dagu binary."
          }

          # A busy port must be reported before any service is registered, so a
          # failed setup cannot leave one behind restarting a process that dies.
          $blocker = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 18081)
          $blocker.Start()
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installerPath `
              -NoPrompt -ServiceOnly -Service yes -ServiceScope system `
              -Port 18081 -OpenBrowser no -InstallDir $installDir
            if ($LASTEXITCODE -eq 0) {
              throw "Service-only install ignored a busy web server port."
            }
            if (Get-Service -Name Dagu -ErrorAction SilentlyContinue) {
              throw "A rejected port left the Dagu service registered."
            }
          }
          finally {
            $blocker.Stop()
          }
          # A rejected install is the expected outcome above. The step would
          # otherwise exit with the code that rejection left behind.
          $global:LASTEXITCODE = 0

      # Exercises the [Code] section of installer.iss, which compilation alone
      # never runs: the machine PATH must be added on install and restored on
      # uninstall. The service task is left off; it is covered by the step above.
      - name: Test Inno Setup installer
        shell: powershell
        run: |
          $installDir = "$env:ProgramFiles\Dagu"
          $before = [Environment]::GetEnvironmentVariable("Path", "Machine")

          Start-Process -Wait -FilePath "dist\dagu-0.0.0-setup.exe" -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=path"
          )
          if (-not (Test-Path "$installDir\dagu.exe")) {
            throw "The installer did not place dagu.exe in $installDir."
          }
          if (([Environment]::GetEnvironmentVariable("Path", "Machine") -split ';') -notcontains $installDir) {
            throw "The installer did not add $installDir to the machine PATH."
          }

          Start-Process -Wait -FilePath "$installDir\unins000.exe" -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          )
          # The uninstaller restarts itself from a temporary copy, so the wait above returns early.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $installDir) -and ((Get-Date) -lt $deadline)) {
            Start-Sleep -Seconds 1
          }
          if (Test-Path $installDir) {
            throw "The uninstaller did not remove $installDir."
          }
          if ([Environment]::GetEnvironmentVariable("Path", "Machine") -ne $before) {
            throw "The uninstaller did not restore the machine PATH."
          }

      - name: Test CMD installer
        shell: cmd
        env:
          _DAGU_INSTALLER_PS1_PATH: ${{ github.workspace }}\scripts\installer.ps1
        run: |
          scripts\installer.cmd -NoPrompt -Service no -OpenBrowser no -InstallDir "%RUNNER_TEMP%\dagu-cmd-install"
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\dagu-cmd-install\dagu.exe" version
          if errorlevel 1 exit /b 1
          scripts\installer.cmd -NoPrompt -Uninstall -InstallDir "%RUNNER_TEMP%\dagu-cmd-install"
          if errorlevel 1 exit /b 1
          if exist "%RUNNER_TEMP%\dagu-cmd-install\dagu.exe" exit /b 1

  test-windows:
    name: Test on windows-latest (${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: unit, shard: 1, shards: 3 }
          - { suite: unit, shard: 2, shards: 3 }
          - { suite: unit, shard: 3, shards: 3 }
          - { suite: intg, shard: 1, shards: 4 }
          - { suite: intg, shard: 2, shards: 4 }
          - { suite: intg, shard: 3, shards: 4 }
          - { suite: intg, shard: 4, shards: 4 }
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go-cache
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Plan test shard
        shell: bash
        run: scripts/ci/go-test-suite.sh "${{ matrix.suite }}" "${{ matrix.shard }}" "${{ matrix.shards }}" > "${RUNNER_TEMP}/go-test-plan.tsv"

      - name: Build (Windows)
        shell: bash
        run: |
          mkdir -p ./.local/bin
          go build -o ./.local/bin/dagu.exe ./cmd

      - name: Test (Windows)
        shell: bash
        run: |
          status=0
          while IFS=$'\t' read -r -u 3 packages run; do
            args=(-timeout=20m -count=1)
            if [[ -n "${run}" ]]; then
              args+=(-run "${run}")
            fi
            # shellcheck disable=SC2086 # packages is a space-separated list.
            go test "${args[@]}" ${packages} || status=1
          done 3< "${RUNNER_TEMP}/go-test-plan.tsv"
          exit "${status}"

      - name: Save Go caches
        if: ${{ github.ref == 'refs/heads/main' && matrix.suite == 'unit' && matrix.shard == 1 }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key }}
