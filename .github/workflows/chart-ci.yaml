name: HelmChartCI

on:
  push:
    branches:
      - main
    paths:
      - "charts/dagu/Chart.yaml"
      - "charts/dagu/values.yaml"
      - "charts/dagu/values.schema.json"
      - "charts/dagu/.helmignore"
      - "charts/dagu/README.md"
      - "charts/dagu/RELEASE.md"
      - "charts/dagu/LICENSE*"
      - "charts/dagu/templates/**"
      - "charts/dagu/charts/**"
      - "charts/dagu/crds/**"
      - ".github/workflows/chart-ci.yaml"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - "charts/dagu/Chart.yaml"
      - "charts/dagu/values.yaml"
      - "charts/dagu/values.schema.json"
      - "charts/dagu/.helmignore"
      - "charts/dagu/README.md"
      - "charts/dagu/RELEASE.md"
      - "charts/dagu/LICENSE*"
      - "charts/dagu/templates/**"
      - "charts/dagu/charts/**"
      - "charts/dagu/crds/**"
      - ".github/workflows/chart-ci.yaml"

# Restrict to read-only: this workflow only lints and packages the chart,
# it never pushes or creates releases. An explicit block prevents the default
# broad token permissions from being available if the workflow is ever compromised.
permissions:
  contents: read

jobs:
  validate:
    name: Validate Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Require chart version bump
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            echo "No base SHA available; skipping chart version check."
            exit 0
          fi

          changed_files="$(git diff --name-only "${base_sha}" "${GITHUB_SHA}" -- \
            charts/dagu/Chart.yaml \
            charts/dagu/values.yaml \
            charts/dagu/values.schema.json \
            charts/dagu/.helmignore \
            charts/dagu/README.md \
            charts/dagu/RELEASE.md \
            charts/dagu/LICENSE* \
            charts/dagu/templates \
            charts/dagu/charts \
            charts/dagu/crds)"

          if [[ -z "${changed_files}" ]]; then
            echo "No packaged chart files changed."
            exit 0
          fi

          old_version="$(git show "${base_sha}:charts/dagu/Chart.yaml" | awk -F': ' '$1=="version"{gsub(/"/,"",$2); print $2; exit}')"
          new_version="$(awk -F': ' '$1=="version"{gsub(/"/,"",$2); print $2; exit}' charts/dagu/Chart.yaml)"

          if [[ -z "${old_version}" || -z "${new_version}" ]]; then
            echo "::error::Unable to read chart version from charts/dagu/Chart.yaml"
            exit 1
          fi

          if [[ "${old_version}" == "${new_version}" ]]; then
            echo "::error::Packaged chart files changed without a chart version bump in charts/dagu/Chart.yaml"
            printf 'Changed packaged files:\n%s\n' "${changed_files}"
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint chart
        run: helm lint ./charts/dagu

      - name: Render chart
        run: helm template dagu ./charts/dagu --set persistence.storageClass=nfs-client >/dev/null

      - name: Render OIDC configuration
        shell: bash
        run: |
          set -euo pipefail

          values=(
            --set persistence.storageClass=nfs-client
            --set-string license.existingSecret=dagu-license
            --set auth.oidc.enabled=true
            --set-string auth.oidc.clientId=ci-client
            --set-string auth.oidc.clientUrl=https://dagu.example.com
            --set-string auth.oidc.issuer=https://idp.example.com
            --set-string auth.oidc.clientSecret.existingSecret=dagu-oidc
            --set-string 'auth.oidc.roleMapping.groupMappings.engineering=developer'
            --set-string 'auth.oidc.roleMapping.workspaceMappings.engineering[0].workspace=platform'
            --set-string 'auth.oidc.roleMapping.workspaceMappings.engineering[0].role=developer'
            --set auth.proxy.enabled=true
          )

          configmap="$(
            helm template dagu ./charts/dagu \
              --show-only templates/configmap.yaml \
              "${values[@]}"
          )"
          ui_deployment="$(
            helm template dagu ./charts/dagu \
              --show-only templates/ui-deployment.yaml \
              "${values[@]}"
          )"

          ruby -ryaml -e '
            manifest = YAML.safe_load($stdin.read)
            config = YAML.safe_load(manifest.fetch("data").fetch("dagu.yaml"))
            oidc = config.dig("auth", "oidc")
            role_mapping = oidc.fetch("role_mapping")

            abort "unexpected OIDC client ID" unless oidc["client_id"] == "ci-client"
            abort "unexpected OIDC client URL" unless oidc["client_url"] == "https://dagu.example.com"
            abort "unexpected OIDC issuer" unless oidc["issuer"] == "https://idp.example.com"
            abort "unexpected OIDC group mapping" unless role_mapping.dig("group_mappings", "engineering") == "developer"
            expected_grants = [{"role" => "developer", "workspace" => "platform"}]
            abort "unexpected OIDC workspace mapping" unless role_mapping.dig("workspace_mappings", "engineering") == expected_grants
            abort "proxy authentication was not rendered" unless config.dig("auth", "proxy", "enabled") == true
          ' <<<"${configmap}"

          ruby -ryaml -e '
            manifest = YAML.safe_load($stdin.read)
            containers = manifest.dig("spec", "template", "spec", "containers")
            ui = containers.find { |container| container["name"] == "ui" }
            env = ui.fetch("env").each_with_object({}) do |entry, entries|
              entries[entry.fetch("name")] = entry
            end

            license_ref = env.dig("DAGU_LICENSE_KEY", "valueFrom", "secretKeyRef")
            expected_license_ref = {"name" => "dagu-license", "key" => "license-key"}
            abort "unexpected license Secret reference" unless license_ref == expected_license_ref

            oidc_ref = env.dig("DAGU_AUTH_OIDC_CLIENT_SECRET", "valueFrom", "secretKeyRef")
            expected_oidc_ref = {"name" => "dagu-oidc", "key" => "client-secret"}
            abort "unexpected OIDC Secret reference" unless oidc_ref == expected_oidc_ref
          ' <<<"${ui_deployment}"

      - name: Package chart
        run: |
          mkdir -p /tmp/dagu-chart
          helm package ./charts/dagu --destination /tmp/dagu-chart >/dev/null
