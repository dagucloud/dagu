name: HelmChartCI

on:
  push:
    branches:
      - main
    paths:
      - "charts/dagu/Chart.yaml"
      - "charts/dagu/values.yaml"
      - "charts/dagu/values.schema.json"
      - "charts/dagu/.helmignore"
      - "charts/dagu/README.md"
      - "charts/dagu/PROXY_AUTH.md"
      - "charts/dagu/RELEASE.md"
      - "charts/dagu/examples/**"
      - "charts/dagu/LICENSE*"
      - "charts/dagu/templates/**"
      - "charts/dagu/charts/**"
      - "charts/dagu/crds/**"
      - ".github/workflows/chart-ci.yaml"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - "charts/dagu/Chart.yaml"
      - "charts/dagu/values.yaml"
      - "charts/dagu/values.schema.json"
      - "charts/dagu/.helmignore"
      - "charts/dagu/README.md"
      - "charts/dagu/PROXY_AUTH.md"
      - "charts/dagu/RELEASE.md"
      - "charts/dagu/examples/**"
      - "charts/dagu/LICENSE*"
      - "charts/dagu/templates/**"
      - "charts/dagu/charts/**"
      - "charts/dagu/crds/**"
      - ".github/workflows/chart-ci.yaml"

# Restrict to read-only: this workflow only lints and packages the chart,
# it never pushes or creates releases. An explicit block prevents the default
# broad token permissions from being available if the workflow is ever compromised.
permissions:
  contents: read

jobs:
  validate:
    name: Validate Helm chart
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Require chart version bump
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            echo "No base SHA available; skipping chart version check."
            exit 0
          fi

          changed_files="$(git diff --name-only "${base_sha}" "${GITHUB_SHA}" -- \
            charts/dagu/Chart.yaml \
            charts/dagu/values.yaml \
            charts/dagu/values.schema.json \
            charts/dagu/.helmignore \
            charts/dagu/README.md \
            charts/dagu/PROXY_AUTH.md \
            charts/dagu/RELEASE.md \
            charts/dagu/examples \
            charts/dagu/LICENSE* \
            charts/dagu/templates \
            charts/dagu/charts \
            charts/dagu/crds)"

          if [[ -z "${changed_files}" ]]; then
            echo "No packaged chart files changed."
            exit 0
          fi

          old_version="$(git show "${base_sha}:charts/dagu/Chart.yaml" | awk -F': ' '$1=="version"{gsub(/"/,"",$2); print $2; exit}')"
          new_version="$(awk -F': ' '$1=="version"{gsub(/"/,"",$2); print $2; exit}' charts/dagu/Chart.yaml)"

          if [[ -z "${old_version}" || -z "${new_version}" ]]; then
            echo "::error::Unable to read chart version from charts/dagu/Chart.yaml"
            exit 1
          fi

          if [[ "${old_version}" == "${new_version}" ]]; then
            echo "::error::Packaged chart files changed without a chart version bump in charts/dagu/Chart.yaml"
            printf 'Changed packaged files:\n%s\n' "${changed_files}"
            exit 1
          fi

      # The templates follow main and the default image is Chart.appVersion,
      # so an older appVersion renders settings its image does not know.
      - name: Require the latest Dagu release as appVersion
        shell: bash
        run: |
          app_version="$(awk -F': ' '$1=="appVersion"{gsub(/"/,"",$2); print $2; exit}' charts/dagu/Chart.yaml)"
          latest="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n 1p || true)"
          if [[ -z "${latest}" ]]; then
            echo "::error::No Dagu release tag found"
            exit 1
          fi
          if [[ "${app_version}" != "${latest#v}" ]]; then
            echo "::error::charts/dagu/Chart.yaml appVersion is ${app_version}; set it to the latest Dagu release, ${latest#v}"
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # "latest" falls back to an older Helm when the release lookup
          # fails, and older releases word schema errors differently.
          version: v4.3.1

      - name: Lint chart
        run: helm lint --strict ./charts/dagu

      - name: Render standalone defaults
        run: |
          helm template dagu ./charts/dagu \
            --namespace dagu \
            --kube-version 1.19.0 >/tmp/dagu-default-render.yaml

          grep -Fq 'cors_allowed_origins: []' /tmp/dagu-default-render.yaml
          grep -Fq 'allowed_hosts: []' /tmp/dagu-default-render.yaml
          grep -Fq -- '- start-all' /tmp/dagu-default-render.yaml
          grep -Fq 'type: ClusterIP' /tmp/dagu-default-render.yaml
          grep -Fq 'helm.sh/resource-policy: keep' /tmp/dagu-default-render.yaml
          grep -Fq 'kind: ServiceAccount' /tmp/dagu-default-render.yaml
          grep -Fq 'serviceAccountName: dagu' /tmp/dagu-default-render.yaml
          test "$(grep -Fc 'httpGet:' /tmp/dagu-default-render.yaml)" -eq 2
          grep -Fq "command: ['wget']" /tmp/dagu-default-render.yaml

      - name: Render IP allowlist
        run: |
          helm template dagu ./charts/dagu \
            --namespace dagu \
            --kube-version 1.35.0 \
            --set-string 'config.ipAccess.allowedIPs[0]=203.0.113.10' \
            --set-string 'config.ipAccess.trustedProxies[0]=10.42.0.0/16' \
            >/tmp/dagu-ip-access-render.yaml

          grep -Fq 'ip_access:' /tmp/dagu-ip-access-render.yaml
          grep -Fq 'allowed_ips: ["203.0.113.10"]' /tmp/dagu-ip-access-render.yaml
          grep -Fq 'trusted_proxies: ["10.42.0.0/16"]' /tmp/dagu-ip-access-render.yaml
          test "$(grep -Fc 'tcpSocket:' /tmp/dagu-ip-access-render.yaml)" -eq 2
          grep -Fq "command: ['nc']" /tmp/dagu-ip-access-render.yaml

      - name: Render distributed mode
        run: |
          helm template dagu ./charts/dagu \
            --namespace dagu \
            --kube-version 1.35.0 \
            --set deploymentMode=distributed \
            --set persistence.accessMode=ReadWriteMany \
            --set persistence.storageClass=nfs-client \
            >/tmp/dagu-distributed-render.yaml

          grep -Fq 'default_execution_mode: "distributed"' /tmp/dagu-distributed-render.yaml
          grep -Fq 'name: dagu-coordinator' /tmp/dagu-distributed-render.yaml
          grep -Fq 'name: dagu-scheduler' /tmp/dagu-distributed-render.yaml
          grep -Fq 'name: dagu-worker-general' /tmp/dagu-distributed-render.yaml
          grep -Fq -- '- ReadWriteMany' /tmp/dagu-distributed-render.yaml
          test "$(grep -Fc 'serviceAccountName: dagu' /tmp/dagu-distributed-render.yaml)" -eq 4
          # Workers report <pod>@<pid> unless a pool sets a stable workerId.
          if grep -Fq 'name: DAGU_WORKER_ID' /tmp/dagu-distributed-render.yaml; then
            echo "::error::Workers without workerId must not set DAGU_WORKER_ID"
            exit 1
          fi

          helm template dagu ./charts/dagu \
            --namespace dagu \
            --kube-version 1.35.0 \
            --set deploymentMode=distributed \
            --set persistence.accessMode=ReadWriteMany \
            --set persistence.storageClass=nfs-client \
            --set workerPools.general.replicas=1 \
            --set-string workerPools.general.workerId=general-01 \
            --show-only templates/worker-deployment.yaml \
            >/tmp/dagu-worker-id-render.yaml

          grep -Fq 'value: "general-01"' /tmp/dagu-worker-id-render.yaml
          grep -Fq 'type: Recreate' /tmp/dagu-worker-id-render.yaml

          # One ID names one worker, so a pool with more replicas is refused.
          if output="$(helm template dagu ./charts/dagu \
            --namespace dagu \
            --set deploymentMode=distributed \
            --set persistence.accessMode=ReadWriteMany \
            --set-string workerPools.general.workerId=general-01 2>&1)"; then
            echo "::error::Expected a workerId on a pool of 2 replicas to be refused"
            exit 1
          fi
          if [[ "${output}" != *"its replicas must be 0 or 1"* ]]; then
            echo "::error::workerId rendering failed for an unexpected reason"
            printf '%s\n' "${output}"
            exit 1
          fi

          helm template dagu ./charts/dagu \
            --namespace dagu \
            --kube-version 1.35.0 \
            --set deploymentMode=distributed \
            --set persistence.accessMode=ReadWriteMany \
            --set persistence.storageClass=nfs-client \
            --set scheduler.replicas=2 \
            --show-only templates/scheduler-deployment.yaml \
            >/tmp/dagu-scheduler-standby-render.yaml

          grep -Fq 'replicas: 2' /tmp/dagu-scheduler-standby-render.yaml

          helm template dagu ./charts/dagu \
            --namespace dagu \
            --kube-version 1.35.0 \
            --set deploymentMode=distributed \
            --set persistence.accessMode=ReadWriteMany \
            --set persistence.storageClass=nfs-client \
            --set coordinator.replicas=2 \
            --show-only templates/coordinator-deployment.yaml \
            >/tmp/dagu-coordinator-render.yaml

          grep -Fq 'replicas: 2' /tmp/dagu-coordinator-render.yaml
          grep -Fq 'type: RollingUpdate' /tmp/dagu-coordinator-render.yaml
          grep -Fq 'maxUnavailable: 1' /tmp/dagu-coordinator-render.yaml
          grep -Fq 'maxSurge: 0' /tmp/dagu-coordinator-render.yaml

          helm template dagu ./charts/dagu \
            --namespace dagu \
            --kube-version 1.35.0 \
            --set deploymentMode=distributed \
            --set persistence.accessMode=ReadWriteMany \
            --set persistence.storageClass=nfs-client \
            --set-string priorityClassName=true \
            --set-string 'workerPools.general.priorityClassName=null' \
            >/tmp/dagu-priority-render.yaml

          # Class names that resemble YAML literals must remain strings.
          test "$(grep -Fc 'priorityClassName: "true"' /tmp/dagu-priority-render.yaml)" -eq 3
          grep -Fq 'priorityClassName: "null"' /tmp/dagu-priority-render.yaml

      - name: Render peer TLS
        run: |
          distributed=(
            --namespace dagu
            --kube-version 1.35.0
            --set deploymentMode=distributed
            --set persistence.accessMode=ReadWriteMany
          )

          # Without a CA Secret, the coordinator keeps its CA in the data
          # volume: no pod mounts one, and the config does not force h2c.
          helm template dagu ./charts/dagu "${distributed[@]}" \
            >/tmp/dagu-peer-default-render.yaml
          if grep -Eq 'insecure: true|peer-ca|ca_cert_file|DAGU_PEER_CA' /tmp/dagu-peer-default-render.yaml; then
            echo "::error::Without peer.existingCASecret, no pod may mount a CA or set peer.insecure"
            exit 1
          fi
          helm template dagu ./charts/dagu "${distributed[@]}" \
            --show-only templates/coordinator-service.yaml \
            >/tmp/dagu-coordinator-service-render.yaml
          grep -Fq 'type: ClusterIP' /tmp/dagu-coordinator-service-render.yaml

          ca_values=(--set-string peer.existingCASecret=dagu-peer-ca)
          helm template dagu ./charts/dagu "${distributed[@]}" "${ca_values[@]}" \
            --show-only templates/configmap.yaml >/tmp/dagu-peer-config-render.yaml
          grep -Fq 'ca_cert_file: "/etc/dagu-peer-ca/ca.crt"' /tmp/dagu-peer-config-render.yaml
          if grep -Fq 'insecure:' /tmp/dagu-peer-config-render.yaml; then
            echo "::error::The rendered config must not set peer.insecure"
            exit 1
          fi

          # Every pod mounts ca.crt read-only and owner-only; only the
          # coordinator gets ca.key and points peer.ca_key_file at it.
          for component in coordinator scheduler ui worker; do
            render="/tmp/dagu-peer-${component}-render.yaml"
            helm template dagu ./charts/dagu "${distributed[@]}" "${ca_values[@]}" \
              --show-only "templates/${component}-deployment.yaml" >"${render}"
            grep -Fq 'secretName: "dagu-peer-ca"' "${render}"
            grep -Fq 'defaultMode: 256' "${render}"
            grep -Fq 'key: ca.crt' "${render}"
            grep -A2 -F -- '- name: peer-ca' "${render}" | grep -Fq 'mountPath: /etc/dagu-peer-ca'
            grep -A2 -F -- '- name: peer-ca' "${render}" | grep -Fq 'readOnly: true'
            if [[ "${component}" == coordinator ]]; then
              grep -Fq 'key: ca.key' "${render}"
              grep -A1 -F 'name: DAGU_PEER_CA_KEY_FILE' "${render}" | grep -Fq 'value: "/etc/dagu-peer-ca/ca.key"'
            elif grep -Eq 'ca\.key|DAGU_PEER_CA_KEY_FILE' "${render}"; then
              echo "::error::Only the coordinator may mount ca.key"
              exit 1
            fi
          done

          # Own certificates in extraEnv conflict with the CA Secret, which
          # Dagu refuses at start, so the render fails instead.
          own_cert_env=(
            --set-string 'extraEnv[0].name=DAGU_PEER_CERT_FILE'
            --set-string 'extraEnv[0].value=/etc/peer-tls/tls.crt'
          )
          helm template dagu ./charts/dagu "${distributed[@]}" "${own_cert_env[@]}" >/dev/null
          if output="$(helm template dagu ./charts/dagu "${distributed[@]}" \
            "${ca_values[@]}" "${own_cert_env[@]}" 2>&1)"; then
            echo "::error::Expected peer.existingCASecret with DAGU_PEER_CERT_FILE to be refused"
            exit 1
          fi
          if [[ "${output}" != *'extraEnv entry "DAGU_PEER_CERT_FILE" must not configure peer certificates'* ]]; then
            echo "::error::Peer CA rendering failed for an unexpected reason"
            printf '%s\n' "${output}"
            exit 1
          fi

          # start-all runs no coordinator, so standalone mode mounts no CA.
          helm template dagu ./charts/dagu --namespace dagu "${ca_values[@]}" \
            >/tmp/dagu-peer-standalone-render.yaml
          if grep -Eq 'peer-ca|ca_cert_file|DAGU_PEER_CA' /tmp/dagu-peer-standalone-render.yaml; then
            echo "::error::Standalone mode must not mount the peer CA"
            exit 1
          fi

          helm template dagu ./charts/dagu "${distributed[@]}" \
            --set coordinator.service.type=LoadBalancer \
            --set-string 'coordinator.service.annotations.example\.com/exposure=internal' \
            --show-only templates/coordinator-service.yaml \
            >/tmp/dagu-coordinator-lb-render.yaml
          grep -Fq 'type: LoadBalancer' /tmp/dagu-coordinator-lb-render.yaml
          grep -Fq 'example.com/exposure: internal' /tmp/dagu-coordinator-lb-render.yaml

          helm template dagu ./charts/dagu "${distributed[@]}" \
            --set coordinator.service.type=NodePort \
            --show-only templates/coordinator-service.yaml \
            >/tmp/dagu-coordinator-nodeport-render.yaml
          grep -Fq 'type: NodePort' /tmp/dagu-coordinator-nodeport-render.yaml

      - name: Smoke-render optional configurations
        run: |
          helm template dagu ./charts/dagu \
            --namespace dagu \
            --set-string license.existingSecret=dagu-license \
            --set auth.oidc.enabled=true \
            --set-string auth.oidc.clientId=ci-client \
            --set-string auth.oidc.clientUrl=https://dagu.example.com \
            --set-string auth.oidc.issuer=https://idp.example.com \
            --set-string auth.oidc.clientSecret.existingSecret=dagu-oidc \
            --set-string 'auth.oidc.roleMapping.groupMappings.engineering=developer' \
            --set-string 'auth.oidc.roleMapping.workspaceMappings.engineering[0].workspace=platform' \
            --set-string 'auth.oidc.roleMapping.workspaceMappings.engineering[0].role=developer' \
            --set ingress.enabled=true \
            --set-string ingress.className=nginx \
            --set-string ingress.host=dagu.example.com \
            --set ingress.tls.enabled=true \
            --set-string ingress.tls.secretName=dagu-tls \
            --set-string 'config.corsAllowedOrigins[0]=https://app.example.com' \
            >/tmp/dagu-optional-render.yaml

          test "$(grep -Fc 'name: DAGU_LICENSE_KEY' /tmp/dagu-optional-render.yaml)" -eq 1
          test "$(grep -Fc 'name: DAGU_AUTH_OIDC_CLIENT_SECRET' /tmp/dagu-optional-render.yaml)" -eq 1
          grep -Fq 'name: "dagu-license"' /tmp/dagu-optional-render.yaml
          grep -Fq 'name: "dagu-oidc"' /tmp/dagu-optional-render.yaml
          grep -Fq 'cors_allowed_origins: ["https://app.example.com"]' /tmp/dagu-optional-render.yaml
          grep -Fq 'allowed_hosts: ["dagu.example.com"]' /tmp/dagu-optional-render.yaml
          grep -Fq 'engineering: developer' /tmp/dagu-optional-render.yaml
          grep -Fq 'workspace: platform' /tmp/dagu-optional-render.yaml
          grep -Fq 'secretName: "dagu-tls"' /tmp/dagu-optional-render.yaml

          helm template dagu ./charts/dagu \
            --namespace dagu \
            --set ui.service.type=LoadBalancer \
            --set-string 'ui.service.annotations.example\.com/exposure=internal' \
            >/tmp/dagu-loadbalancer-render.yaml

          grep -Fq 'type: LoadBalancer' /tmp/dagu-loadbalancer-render.yaml
          grep -Fq 'example.com/exposure: internal' /tmp/dagu-loadbalancer-render.yaml

          helm template dagu ./charts/dagu \
            --namespace dagu \
            --set auth.proxy.enabled=true \
            --set-string auth.proxy.source=oauth2-proxy >/dev/null

          expect_proxy_render_failure() {
            expected_path="$1"
            shift
            if output="$(helm template dagu ./charts/dagu \
              --namespace dagu \
              --set auth.proxy.enabled=true \
              "$@" 2>&1)"; then
              echo "::error::Expected proxy-auth rendering to reject: $*"
              exit 1
            fi
            if [[ "${output}" != *"${expected_path}"* ]]; then
              echo "::error::Proxy-auth rendering failed for an unexpected reason: $*"
              printf '%s\n' "${output}"
              exit 1
            fi
          }

          expect_proxy_render_failure \
            "/ui/service/type" \
            --set ui.service.type=LoadBalancer
          expect_proxy_render_failure \
            "/ui/service/type" \
            --set ui.service.type=NodePort
          expect_proxy_render_failure \
            "/ingress/enabled" \
            --set ingress.enabled=true

          helm template dagu ./charts/dagu \
            --namespace dagu \
            --set auth.mode=basic \
            --set-string auth.basic.existingSecret=dagu-basic-auth >/dev/null

          helm template dagu ./charts/dagu \
            --namespace dagu \
            --set ui.service.port=80 \
            --set persistence.retain=false \
            --set-string persistence.existingClaim=existing-dagu-data >/dev/null

          helm template dagu ./charts/dagu \
            --namespace dagu \
            --set deploymentMode=distributed \
            --set persistence.accessMode=ReadWriteMany \
            --set-string persistence.existingClaim=existing-dagu-data >/dev/null

          helm template dagu ./charts/dagu \
            --namespace dagu \
            --set-string serviceAccount.name=dagu-runtime \
            --set-string 'serviceAccount.annotations.workload\.example\.com/identity=dagu' \
            >/tmp/dagu-service-account-render.yaml

          grep -Fq 'name: dagu-runtime' /tmp/dagu-service-account-render.yaml
          grep -Fq 'serviceAccountName: dagu-runtime' /tmp/dagu-service-account-render.yaml
          grep -Fq 'workload.example.com/identity: dagu' /tmp/dagu-service-account-render.yaml

          helm template dagu ./charts/dagu \
            --namespace dagu \
            --set serviceAccount.create=false \
            --set-string serviceAccount.name=existing-dagu-runtime \
            >/tmp/dagu-existing-service-account-render.yaml

          grep -Fq 'serviceAccountName: existing-dagu-runtime' /tmp/dagu-existing-service-account-render.yaml

          helm template dagu ./charts/dagu \
            --namespace dagu \
            --set deploymentMode=distributed \
            --set persistence.accessMode=ReadWriteMany \
            --set-string 'extraVolumes[0].name=ca-bundle' \
            --set-string 'extraVolumes[0].secret.secretName=dagu-ca-bundle' \
            --set-string 'extraVolumeMounts[0].name=ca-bundle' \
            --set-string 'extraVolumeMounts[0].mountPath=/etc/ssl/certs/dagu-ca-bundle.pem' \
            --set-string 'extraVolumeMounts[0].subPath=ca-bundle.pem' \
            --set 'extraVolumeMounts[0].readOnly=true' \
            >/tmp/dagu-extra-volume-render.yaml

          test "$(grep -Fc 'mountPath: /etc/ssl/certs/dagu-ca-bundle.pem' /tmp/dagu-extra-volume-render.yaml)" -eq 4
          test "$(grep -Fc 'secretName: dagu-ca-bundle' /tmp/dagu-extra-volume-render.yaml)" -eq 4

      - name: Package chart
        run: |
          mkdir -p /tmp/dagu-chart
          helm package ./charts/dagu --destination /tmp/dagu-chart >/dev/null
