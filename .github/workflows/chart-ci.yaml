name: HelmChartCI

on:
  push:
    branches:
      - main
    paths:
      - "charts/dagu/Chart.yaml"
      - "charts/dagu/values.yaml"
      - "charts/dagu/values.schema.json"
      - "charts/dagu/.helmignore"
      - "charts/dagu/README.md"
      - "charts/dagu/PROXY_AUTH.md"
      - "charts/dagu/RELEASE.md"
      - "charts/dagu/examples/**"
      - "charts/dagu/LICENSE*"
      - "charts/dagu/templates/**"
      - "charts/dagu/charts/**"
      - "charts/dagu/crds/**"
      - ".github/workflows/chart-ci.yaml"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - "charts/dagu/Chart.yaml"
      - "charts/dagu/values.yaml"
      - "charts/dagu/values.schema.json"
      - "charts/dagu/.helmignore"
      - "charts/dagu/README.md"
      - "charts/dagu/PROXY_AUTH.md"
      - "charts/dagu/RELEASE.md"
      - "charts/dagu/examples/**"
      - "charts/dagu/LICENSE*"
      - "charts/dagu/templates/**"
      - "charts/dagu/charts/**"
      - "charts/dagu/crds/**"
      - ".github/workflows/chart-ci.yaml"

# Restrict to read-only: this workflow only lints and packages the chart,
# it never pushes or creates releases. An explicit block prevents the default
# broad token permissions from being available if the workflow is ever compromised.
permissions:
  contents: read

jobs:
  validate:
    name: Validate Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Require chart version bump
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            echo "No base SHA available; skipping chart version check."
            exit 0
          fi

          changed_files="$(git diff --name-only "${base_sha}" "${GITHUB_SHA}" -- \
            charts/dagu/Chart.yaml \
            charts/dagu/values.yaml \
            charts/dagu/values.schema.json \
            charts/dagu/.helmignore \
            charts/dagu/README.md \
            charts/dagu/PROXY_AUTH.md \
            charts/dagu/RELEASE.md \
            charts/dagu/examples \
            charts/dagu/LICENSE* \
            charts/dagu/templates \
            charts/dagu/charts \
            charts/dagu/crds)"

          if [[ -z "${changed_files}" ]]; then
            echo "No packaged chart files changed."
            exit 0
          fi

          old_version="$(git show "${base_sha}:charts/dagu/Chart.yaml" | awk -F': ' '$1=="version"{gsub(/"/,"",$2); print $2; exit}')"
          new_version="$(awk -F': ' '$1=="version"{gsub(/"/,"",$2); print $2; exit}' charts/dagu/Chart.yaml)"

          if [[ -z "${old_version}" || -z "${new_version}" ]]; then
            echo "::error::Unable to read chart version from charts/dagu/Chart.yaml"
            exit 1
          fi

          if [[ "${old_version}" == "${new_version}" ]]; then
            echo "::error::Packaged chart files changed without a chart version bump in charts/dagu/Chart.yaml"
            printf 'Changed packaged files:\n%s\n' "${changed_files}"
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint chart
        run: helm lint --strict ./charts/dagu

      - name: Render standalone defaults
        run: |
          helm template dagu ./charts/dagu \
            --namespace dagu \
            --kube-version 1.19.0 >/tmp/dagu-default-render.yaml

          grep -Fq 'cors_allowed_origins: []' /tmp/dagu-default-render.yaml
          grep -Fq -- '- start-all' /tmp/dagu-default-render.yaml
          grep -Fq 'type: ClusterIP' /tmp/dagu-default-render.yaml
          grep -Fq 'helm.sh/resource-policy: keep' /tmp/dagu-default-render.yaml
          grep -Fq 'kind: ServiceAccount' /tmp/dagu-default-render.yaml
          grep -Fq 'serviceAccountName: dagu' /tmp/dagu-default-render.yaml
          test "$(grep -Fc 'httpGet:' /tmp/dagu-default-render.yaml)" -eq 2
          grep -Fq "command: ['wget']" /tmp/dagu-default-render.yaml

      - name: Render IP allowlist
        run: |
          helm template dagu ./charts/dagu \
            --namespace dagu \
            --kube-version 1.35.0 \
            --set-string 'config.ipAccess.allowedIPs[0]=203.0.113.10' \
            --set-string 'config.ipAccess.trustedProxies[0]=10.42.0.0/16' \
            >/tmp/dagu-ip-access-render.yaml

          grep -Fq 'ip_access:' /tmp/dagu-ip-access-render.yaml
          grep -Fq 'allowed_ips: ["203.0.113.10"]' /tmp/dagu-ip-access-render.yaml
          grep -Fq 'trusted_proxies: ["10.42.0.0/16"]' /tmp/dagu-ip-access-render.yaml
          test "$(grep -Fc 'tcpSocket:' /tmp/dagu-ip-access-render.yaml)" -eq 2
          grep -Fq "command: ['nc']" /tmp/dagu-ip-access-render.yaml

      - name: Render distributed mode
        run: |
          helm template dagu ./charts/dagu \
            --namespace dagu \
            --kube-version 1.35.0 \
            --set deploymentMode=distributed \
            --set persistence.accessMode=ReadWriteMany \
            --set persistence.storageClass=nfs-client \
            >/tmp/dagu-distributed-render.yaml

          grep -Fq 'default_execution_mode: "distributed"' /tmp/dagu-distributed-render.yaml
          grep -Fq 'name: dagu-coordinator' /tmp/dagu-distributed-render.yaml
          grep -Fq 'name: dagu-scheduler' /tmp/dagu-distributed-render.yaml
          grep -Fq 'name: dagu-worker-general' /tmp/dagu-distributed-render.yaml
          grep -Fq -- '- ReadWriteMany' /tmp/dagu-distributed-render.yaml
          test "$(grep -Fc 'serviceAccountName: dagu' /tmp/dagu-distributed-render.yaml)" -eq 4

          helm template dagu ./charts/dagu \
            --namespace dagu \
            --kube-version 1.35.0 \
            --set deploymentMode=distributed \
            --set persistence.accessMode=ReadWriteMany \
            --set persistence.storageClass=nfs-client \
            --set coordinator.replicas=2 \
            --show-only templates/coordinator-deployment.yaml \
            >/tmp/dagu-coordinator-render.yaml

          grep -Fq 'replicas: 2' /tmp/dagu-coordinator-render.yaml
          grep -Fq 'type: RollingUpdate' /tmp/dagu-coordinator-render.yaml
          grep -Fq 'maxUnavailable: 1' /tmp/dagu-coordinator-render.yaml
          grep -Fq 'maxSurge: 0' /tmp/dagu-coordinator-render.yaml

      - name: Smoke-render optional configurations
        run: |
          helm template dagu ./charts/dagu \
            --namespace dagu \
            --set-string license.existingSecret=dagu-license \
            --set auth.oidc.enabled=true \
            --set-string auth.oidc.clientId=ci-client \
            --set-string auth.oidc.clientUrl=https://dagu.example.com \
            --set-string auth.oidc.issuer=https://idp.example.com \
            --set-string auth.oidc.clientSecret.existingSecret=dagu-oidc \
            --set-string 'auth.oidc.roleMapping.groupMappings.engineering=developer' \
            --set-string 'auth.oidc.roleMapping.workspaceMappings.engineering[0].workspace=platform' \
            --set-string 'auth.oidc.roleMapping.workspaceMappings.engineering[0].role=developer' \
            --set ingress.enabled=true \
            --set-string ingress.className=nginx \
            --set-string ingress.host=dagu.example.com \
            --set ingress.tls.enabled=true \
            --set-string ingress.tls.secretName=dagu-tls \
            --set-string 'config.corsAllowedOrigins[0]=https://app.example.com' \
            >/tmp/dagu-optional-render.yaml

          test "$(grep -Fc 'name: DAGU_LICENSE_KEY' /tmp/dagu-optional-render.yaml)" -eq 1
          test "$(grep -Fc 'name: DAGU_AUTH_OIDC_CLIENT_SECRET' /tmp/dagu-optional-render.yaml)" -eq 1
          grep -Fq 'name: "dagu-license"' /tmp/dagu-optional-render.yaml
          grep -Fq 'name: "dagu-oidc"' /tmp/dagu-optional-render.yaml
          grep -Fq 'cors_allowed_origins: ["https://app.example.com"]' /tmp/dagu-optional-render.yaml
          grep -Fq 'engineering: developer' /tmp/dagu-optional-render.yaml
          grep -Fq 'workspace: platform' /tmp/dagu-optional-render.yaml
          grep -Fq 'secretName: "dagu-tls"' /tmp/dagu-optional-render.yaml

          helm template dagu ./charts/dagu \
            --namespace dagu \
            --set ui.service.type=LoadBalancer \
            --set-string 'ui.service.annotations.example\.com/exposure=internal' \
            >/tmp/dagu-loadbalancer-render.yaml

          grep -Fq 'type: LoadBalancer' /tmp/dagu-loadbalancer-render.yaml
          grep -Fq 'example.com/exposure: internal' /tmp/dagu-loadbalancer-render.yaml

          helm template dagu ./charts/dagu \
            --namespace dagu \
            --set auth.proxy.enabled=true \
            --set-string auth.proxy.source=oauth2-proxy >/dev/null

          expect_proxy_render_failure() {
            expected_path="$1"
            shift
            if output="$(helm template dagu ./charts/dagu \
              --namespace dagu \
              --set auth.proxy.enabled=true \
              "$@" 2>&1)"; then
              echo "::error::Expected proxy-auth rendering to reject: $*"
              exit 1
            fi
            if [[ "${output}" != *"${expected_path}"* ]]; then
              echo "::error::Proxy-auth rendering failed for an unexpected reason: $*"
              printf '%s\n' "${output}"
              exit 1
            fi
          }

          expect_proxy_render_failure \
            "/ui/service/type" \
            --set ui.service.type=LoadBalancer
          expect_proxy_render_failure \
            "/ui/service/type" \
            --set ui.service.type=NodePort
          expect_proxy_render_failure \
            "/ingress/enabled" \
            --set ingress.enabled=true

          helm template dagu ./charts/dagu \
            --namespace dagu \
            --set auth.mode=basic \
            --set-string auth.basic.existingSecret=dagu-basic-auth >/dev/null

          helm template dagu ./charts/dagu \
            --namespace dagu \
            --set ui.service.port=80 \
            --set persistence.retain=false \
            --set-string persistence.existingClaim=existing-dagu-data >/dev/null

          helm template dagu ./charts/dagu \
            --namespace dagu \
            --set deploymentMode=distributed \
            --set persistence.accessMode=ReadWriteMany \
            --set-string persistence.existingClaim=existing-dagu-data >/dev/null

          helm template dagu ./charts/dagu \
            --namespace dagu \
            --set-string serviceAccount.name=dagu-runtime \
            --set-string 'serviceAccount.annotations.workload\.example\.com/identity=dagu' \
            >/tmp/dagu-service-account-render.yaml

          grep -Fq 'name: dagu-runtime' /tmp/dagu-service-account-render.yaml
          grep -Fq 'serviceAccountName: dagu-runtime' /tmp/dagu-service-account-render.yaml
          grep -Fq 'workload.example.com/identity: dagu' /tmp/dagu-service-account-render.yaml

          helm template dagu ./charts/dagu \
            --namespace dagu \
            --set serviceAccount.create=false \
            --set-string serviceAccount.name=existing-dagu-runtime \
            >/tmp/dagu-existing-service-account-render.yaml

          grep -Fq 'serviceAccountName: existing-dagu-runtime' /tmp/dagu-existing-service-account-render.yaml

          helm template dagu ./charts/dagu \
            --namespace dagu \
            --set deploymentMode=distributed \
            --set persistence.accessMode=ReadWriteMany \
            --set-string 'extraVolumes[0].name=ca-bundle' \
            --set-string 'extraVolumes[0].secret.secretName=dagu-ca-bundle' \
            --set-string 'extraVolumeMounts[0].name=ca-bundle' \
            --set-string 'extraVolumeMounts[0].mountPath=/etc/ssl/certs/dagu-ca-bundle.pem' \
            --set-string 'extraVolumeMounts[0].subPath=ca-bundle.pem' \
            --set 'extraVolumeMounts[0].readOnly=true' \
            >/tmp/dagu-extra-volume-render.yaml

          test "$(grep -Fc 'mountPath: /etc/ssl/certs/dagu-ca-bundle.pem' /tmp/dagu-extra-volume-render.yaml)" -eq 4
          test "$(grep -Fc 'secretName: dagu-ca-bundle' /tmp/dagu-extra-volume-render.yaml)" -eq 4

      - name: Package chart
        run: |
          mkdir -p /tmp/dagu-chart
          helm package ./charts/dagu --destination /tmp/dagu-chart >/dev/null
