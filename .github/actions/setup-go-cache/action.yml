name: Set up Go with the CI build cache
description: >-
  Installs Go and restores the module and build caches last saved from main, so
  a job compiles only what changed since then. The action never saves; the job
  that owns the cache saves it with actions/cache/save and the outputs below.
  On Windows it also moves the Go caches and TEMP to the D: drive for the rest
  of the job.

inputs:
  go-version:
    description: Go version to install.
    required: true

outputs:
  cache-paths:
    description: Directories that make up the cache.
    value: ${{ steps.paths.outputs.paths }}
  cache-key:
    description: Key to save the cache under for this commit.
    value: ${{ steps.key.outputs.key }}

runs:
  using: composite
  steps:
    # The runner's D: drive is a local disk, far faster than the C: system
    # drive that holds the Go caches and temporary files by default.
    - name: Use the D drive
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        @(
          "GOCACHE=D:\go\cache"
          "GOMODCACHE=D:\go\mod"
          "TEMP=$env:RUNNER_TEMP"
          "TMP=$env:RUNNER_TEMP"
        ) | Add-Content -Path $env:GITHUB_ENV

    - name: Install Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: ${{ inputs.go-version }}
        # The built-in cache is keyed on go.sum alone, so the first job to
        # finish saves it once and later commits restore a stale build cache.
        cache: false

    - name: Locate Go caches
      id: paths
      shell: bash
      run: |
        {
          echo "paths<<EOF"
          go env GOCACHE GOMODCACHE
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    - name: Compute cache key
      id: key
      shell: bash
      run: |
        prefix="go-test-${RUNNER_OS}-${{ hashFiles('go.sum') }}-"
        {
          echo "prefix=${prefix}"
          echo "key=${prefix}${GITHUB_SHA}"
        } >> "${GITHUB_OUTPUT}"

    - name: Restore Go caches
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.paths }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          ${{ steps.key.outputs.prefix }}
          go-test-${{ runner.os }}-
