{{- if eq .Values.deploymentMode "distributed" }}
{{- /* dig keeps an upgrade that reuses an older chart's values working. */}}
{{- $service := dig "coordinator" "service" (dict) .Values.AsMap }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dagu.componentName" (dict "root" . "component" "coordinator") }}
  labels:
    {{- include "dagu.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
{{- with $service.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
spec:
  type: {{ $service.type | default "ClusterIP" }}
  selector:
    {{- include "dagu.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
  ports:
    - name: grpc
      port: 50055
      targetPort: grpc
      protocol: TCP
{{- end }}
