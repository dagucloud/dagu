apiVersion: v1
kind: Pod
metadata:
  name: {{ include "dagu.componentName" (dict "root" . "component" "test-connection") | quote }}
  labels:
    {{- include "dagu.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: wget
      image: "{{ .Values.test.image.repository }}:{{ .Values.test.image.tag }}"
      imagePullPolicy: {{ .Values.test.image.pullPolicy }}
{{- if .Values.config.ipAccess.allowedIPs }}
      command: ['nc']
      args: ['-z', '-w', '5', '{{ include "dagu.componentName" (dict "root" . "component" "ui") }}', '{{ .Values.ui.service.port }}']
{{- else }}
      command: ['wget']
      args: ['--spider', '-T', '5', 'http://{{ include "dagu.componentName" (dict "root" . "component" "ui") }}:{{ .Values.ui.service.port }}/api/v1/health']
{{- end }}
  restartPolicy: Never
