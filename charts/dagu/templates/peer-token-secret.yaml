{{- if and (eq .Values.deploymentMode "distributed") (empty (default (dict) .Values.peerToken).existingSecret) }}
{{- $name := include "dagu.peerTokenSecretName" . }}
{{- $key := include "dagu.peerTokenSecretKey" . }}
{{- /*
Reuse the stored token, so an upgrade does not replace the token that running
pods hold. A render without cluster access, such as Argo CD's, cannot read it
and generates a new token each time; such installs set peerToken.existingSecret.
*/}}
{{- $token := randAlphaNum 64 | b64enc }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- with index (default (dict) .data) $key }}
{{- $token = . }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "dagu.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key | quote }}: {{ $token | quote }}
{{- end }}
