{{- if and (eq .Values.deploymentMode "distributed") (empty .Values.peerToken.existingSecret) }}
{{- $name := include "dagu.peerTokenSecretName" . }}
{{- $key := .Values.peerToken.secretKey }}
{{- /* Reuse the stored token, so an upgrade does not replace the token that running pods hold. */}}
{{- $token := randAlphaNum 64 | b64enc }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- with index (default (dict) .data) $key }}
{{- $token = . }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "dagu.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key | quote }}: {{ $token | quote }}
{{- end }}
