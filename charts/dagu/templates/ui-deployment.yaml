apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dagu.fullname" . }}-ui
  labels:
    {{- include "dagu.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicas }}
{{- if .Values.auth.proxy.enabled }}
  strategy:
    type: Recreate
{{- end }}
  selector:
    matchLabels:
      {{- include "dagu.labels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "dagu.labels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      # Disable Kubernetes Service env var injection to avoid overriding
      # dagu config values (e.g., scheduler.port) with Service URLs
      enableServiceLinks: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ include "dagu.imagePullPolicy" . }}
          args:
            - dagu
            - server
            - --config
            - /etc/dagu/dagu.yaml
          env:
            - name: DAGU_HOME
              value: /data
            - name: DAGU_PORT
              value: {{ .Values.ui.service.port | quote }}
{{- with .Values.license.existingSecret }}
            - name: DAGU_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.license.secretKey | quote }}
{{- end }}
{{- if .Values.auth.oidc.enabled }}
            - name: DAGU_AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.oidc.clientSecret.existingSecret | quote }}
                  key: {{ .Values.auth.oidc.clientSecret.secretKey | quote }}
{{- end }}
{{- with include "dagu.extraEnv" . }}
{{ . | nindent 12 }}
{{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.service.port }}
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/dagu
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "dagu.fullname" . }}-data
        - name: config
          configMap:
            name: {{ include "dagu.fullname" . }}-config
