{{- $podAnnotations := deepCopy .Values.podAnnotations }}
{{- $_ := set $podAnnotations "checksum/config" (include (print $.Template.BasePath "/configmap.yaml") . | sha256sum) }}
{{- if .Values.serviceAccount.create }}
{{- $_ = set $podAnnotations "checksum/service-account" (.Values.serviceAccount.annotations | toJson | sha256sum) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dagu.componentName" (dict "root" . "component" "ui") }}
  labels:
    {{- include "dagu.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicas }}
{{- if or (eq .Values.deploymentMode "standalone") .Values.auth.proxy.enabled }}
  strategy:
    type: Recreate
{{- end }}
  selector:
    matchLabels:
      {{- include "dagu.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      annotations:
        {{- toYaml $podAnnotations | nindent 8 }}
      labels:
        {{- include "dagu.labels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      # Disable Kubernetes Service env var injection to avoid overriding
      # dagu config values (e.g., scheduler.port) with Service URLs
      enableServiceLinks: false
      serviceAccountName: {{ include "dagu.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: {{ include "dagu.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - dagu
            - {{ ternary "start-all" "server" (eq .Values.deploymentMode "standalone") }}
            - --config
            - /etc/dagu/dagu.yaml
          env:
            - name: DAGU_HOME
              value: /data
            - name: DAGU_PORT
              value: {{ .Values.ui.containerPort | quote }}
{{- if eq .Values.auth.mode "basic" }}
            - name: DAGU_AUTH_BASIC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.basic.existingSecret | quote }}
                  key: {{ .Values.auth.basic.usernameKey | quote }}
            - name: DAGU_AUTH_BASIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.basic.existingSecret | quote }}
                  key: {{ .Values.auth.basic.passwordKey | quote }}
{{- end }}
{{- with .Values.license.existingSecret }}
            - name: DAGU_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.license.secretKey | quote }}
{{- end }}
{{- if .Values.auth.oidc.enabled }}
            - name: DAGU_AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.oidc.clientSecret.existingSecret | quote }}
                  key: {{ .Values.auth.oidc.clientSecret.secretKey | quote }}
{{- end }}
{{- with include "dagu.extraEnv" . }}
{{ . | nindent 12 }}
{{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.containerPort }}
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/dagu
{{- with .Values.extraVolumeMounts }}
{{ toYaml . | nindent 12 }}
{{- end }}
          livenessProbe:
{{- if .Values.config.ipAccess.allowedIPs }}
            tcpSocket:
              port: http
{{- else }}
            httpGet:
              path: /api/v1/health
              port: http
{{- end }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
{{- if .Values.config.ipAccess.allowedIPs }}
            tcpSocket:
              port: http
{{- else }}
            httpGet:
              path: /api/v1/health
              port: http
{{- end }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "dagu.pvcName" . | quote }}
        - name: config
          configMap:
            name: {{ include "dagu.componentName" (dict "root" . "component" "config") }}
{{- with .Values.extraVolumes }}
{{ toYaml . | nindent 8 }}
{{- end }}
