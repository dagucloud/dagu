{{- if eq .Values.deploymentMode "distributed" }}
{{- $podAnnotations := deepCopy .Values.podAnnotations }}
{{- $_ := set $podAnnotations "checksum/config" (include "dagu.distributedConfigChecksum" .) }}
{{- if .Values.serviceAccount.create }}
{{- $_ = set $podAnnotations "checksum/service-account" (.Values.serviceAccount.annotations | toJson | sha256sum) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dagu.componentName" (dict "root" . "component" "scheduler") }}
  labels:
    {{- include "dagu.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.scheduler.replicas }}
  selector:
    matchLabels:
      {{- include "dagu.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      annotations:
        {{- toYaml $podAnnotations | nindent 8 }}
      labels:
        {{- include "dagu.labels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
    spec:
      # Disable Kubernetes Service env var injection to avoid overriding
      # dagu config values (e.g., scheduler.port) with Service URLs
      enableServiceLinks: false
      # Room for the drain, then for runs' abort and exit handlers.
      terminationGracePeriodSeconds: {{ add (int $.Values.shutdown.drainTimeoutSeconds) 60 }}
      serviceAccountName: {{ include "dagu.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: scheduler
          image: {{ include "dagu.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - dagu
            - scheduler
            - --config
            - /etc/dagu/dagu.yaml
          env:
            - name: DAGU_HOME
              value: /data
            - name: DAGU_SIGNAL_DRAIN_TIMEOUT
              value: {{ printf "%ds" (int $.Values.shutdown.drainTimeoutSeconds) | quote }}
{{- with include "dagu.extraEnv" . }}
{{ . | nindent 12 }}
{{- end }}
          ports:
            - name: health
              containerPort: 8090
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/dagu
{{- with .Values.extraVolumeMounts }}
{{ toYaml . | nindent 12 }}
{{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "dagu.pvcName" . | quote }}
        - name: config
          configMap:
            name: {{ include "dagu.componentName" (dict "root" . "component" "config") }}
{{- with .Values.extraVolumes }}
{{ toYaml . | nindent 8 }}
{{- end }}
{{- end }}
