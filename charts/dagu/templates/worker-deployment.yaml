{{- if eq .Values.deploymentMode "distributed" }}
{{- $workerIds := dict }}
{{- range $poolName, $pool := .Values.workerPools }}
{{- $dataSizeLimit := dig "dataVolume" "sizeLimit" "" $pool }}
{{- $resources := default (dict) $pool.resources }}
{{- $nodeSelector := default $.Values.nodeSelector $pool.nodeSelector }}
{{- $tolerations := default $.Values.tolerations $pool.tolerations }}
{{- $affinity := default $.Values.affinity $pool.affinity }}
{{- $priorityClassName := default $.Values.priorityClassName $pool.priorityClassName }}
{{- $podAnnotations := deepCopy $.Values.podAnnotations }}
{{- $_ := set $podAnnotations "checksum/config" (include "dagu.distributedConfigChecksum" $) }}
{{- if $.Values.serviceAccount.create }}
{{- $_ = set $podAnnotations "checksum/service-account" ($.Values.serviceAccount.annotations | toJson | sha256sum) }}
{{- end }}
{{- if not (regexMatch "^[a-z]([a-z0-9-]*[a-z0-9])?$" $poolName) }}
{{- fail (printf "invalid workerPool name %q: use lowercase letters, numbers, and internal hyphens" $poolName) }}
{{- end }}
{{- if gt (len $poolName) 54 }}
{{- fail (printf "invalid workerPool name %q: must not exceed 54 characters" $poolName) }}
{{- end }}
{{- with $pool.workerId }}
{{- /* Pods of a Deployment share the pool's ID, so only one may run. */}}
{{- if gt (int $pool.replicas) 1 }}
{{- fail (printf "workerPool %q sets workerId, so its replicas must be 0 or 1" $poolName) }}
{{- end }}
{{- if hasKey $workerIds (lower .) }}
{{- fail (printf "workerPool %q sets workerId %q, which another pool also sets" $poolName .) }}
{{- end }}
{{- $_ := set $workerIds (lower .) true }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dagu.componentName" (dict "root" $ "component" (printf "worker-%s" $poolName)) }}
  labels:
    {{- include "dagu.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker
    dagu.sh/worker-pool: {{ $poolName }}
spec:
  replicas: {{ $pool.replicas }}
  {{- if $pool.workerId }}
  # The replacement pod takes the same worker ID, so the old pod stops first.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "dagu.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: worker
      dagu.sh/worker-pool: {{ $poolName }}
  template:
    metadata:
      annotations:
        {{- toYaml $podAnnotations | nindent 8 }}
      labels:
        {{- include "dagu.labels" $ | nindent 8 }}
        app.kubernetes.io/component: worker
        dagu.sh/worker-pool: {{ $poolName }}
    spec:
      # Disable Kubernetes Service env var injection to avoid overriding
      # dagu config values (e.g., scheduler.port) with Service URLs
      enableServiceLinks: false
      {{- $workerShutdown := $.Values.worker.shutdownTimeoutSeconds }}
      {{- if or $.Values.shutdown.drainTimeoutSeconds $workerShutdown }}
      # Room for the drain, then for worker.shutdown_timeout (60s unless set)
      # and the worker's own cleanup.
      terminationGracePeriodSeconds: {{ add (int $.Values.shutdown.drainTimeoutSeconds) (int (default 60 $workerShutdown)) 15 }}
      {{- end }}
      serviceAccountName: {{ include "dagu.serviceAccountName" $ }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "dagu.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - dagu
            - worker
            - --config
            - /etc/dagu/dagu.yaml
            - --worker.coordinators
            - "{{ include "dagu.componentName" (dict "root" $ "component" "coordinator") }}:50055"
            - --worker.max-active-runs
            - {{ $.Values.worker.maxActiveRuns | quote }}
            {{- if $pool.labels }}
            - --worker.labels
            - {{ include "dagu.workerLabels" $pool.labels | quote }}
            {{- end }}
          env:
            - name: DAGU_HOME
              value: /data
{{- with $pool.workerId }}
            - name: DAGU_WORKER_ID
              value: {{ . | quote }}
{{- end }}
{{- with $.Values.shutdown.drainTimeoutSeconds }}
            - name: DAGU_SIGNAL_DRAIN_TIMEOUT
              value: {{ printf "%ds" (int .) | quote }}
{{- end }}
{{- with $.Values.worker.shutdownTimeoutSeconds }}
            - name: DAGU_WORKER_SHUTDOWN_TIMEOUT
              value: {{ printf "%ds" (int .) | quote }}
{{- end }}
{{- with include "dagu.peerTokenEnv" $ }}
{{ . | nindent 12 }}
{{- end }}
{{- with include "dagu.extraEnv" $ }}
{{ . | nindent 12 }}
{{- end }}
          ports:
            - name: health
              containerPort: {{ $.Values.worker.healthPort }}
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/dagu
{{- with $.Values.extraVolumeMounts }}
{{ toYaml . | nindent 12 }}
{{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml $resources | nindent 12 }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      volumes:
        - name: data
          {{- if $dataSizeLimit }}
          emptyDir:
            sizeLimit: {{ $dataSizeLimit | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          configMap:
            name: {{ include "dagu.componentName" (dict "root" $ "component" "config") }}
{{- with $.Values.extraVolumes }}
{{ toYaml . | nindent 8 }}
{{- end }}
{{- end }}
{{- end }}
