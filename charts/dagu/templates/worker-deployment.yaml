{{- if eq .Values.deploymentMode "distributed" }}
{{- range $poolName, $pool := .Values.workerPools }}
{{- $dataSizeLimit := dig "dataVolume" "sizeLimit" "" $pool }}
{{- $resources := default (dict) $pool.resources }}
{{- $nodeSelector := default $.Values.nodeSelector $pool.nodeSelector }}
{{- $tolerations := default $.Values.tolerations $pool.tolerations }}
{{- $affinity := default $.Values.affinity $pool.affinity }}
{{- $podAnnotations := deepCopy $.Values.podAnnotations }}
{{- $_ := set $podAnnotations "checksum/config" (include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum) }}
{{- if not (regexMatch "^[a-z]([a-z0-9-]*[a-z0-9])?$" $poolName) }}
{{- fail (printf "invalid workerPool name %q: use lowercase letters, numbers, and internal hyphens" $poolName) }}
{{- end }}
{{- if gt (len $poolName) 54 }}
{{- fail (printf "invalid workerPool name %q: must not exceed 54 characters" $poolName) }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dagu.componentName" (dict "root" $ "component" (printf "worker-%s" $poolName)) }}
  labels:
    {{- include "dagu.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker
    dagu.sh/worker-pool: {{ $poolName }}
spec:
  replicas: {{ $pool.replicas }}
  selector:
    matchLabels:
      {{- include "dagu.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: worker
      dagu.sh/worker-pool: {{ $poolName }}
  template:
    metadata:
      annotations:
        {{- toYaml $podAnnotations | nindent 8 }}
      labels:
        {{- include "dagu.labels" $ | nindent 8 }}
        app.kubernetes.io/component: worker
        dagu.sh/worker-pool: {{ $poolName }}
    spec:
      # Disable Kubernetes Service env var injection to avoid overriding
      # dagu config values (e.g., scheduler.port) with Service URLs
      enableServiceLinks: false
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "dagu.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - dagu
            - worker
            - --config
            - /etc/dagu/dagu.yaml
            - --worker.coordinators
            - "{{ include "dagu.componentName" (dict "root" $ "component" "coordinator") }}:50055"
            - --worker.max-active-runs
            - {{ $.Values.worker.maxActiveRuns | quote }}
            {{- if $pool.labels }}
            - --worker.labels
            - {{ include "dagu.workerLabels" $pool.labels | quote }}
            {{- end }}
          env:
            - name: DAGU_HOME
              value: /data
            - name: DAGU_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
{{- with include "dagu.extraEnv" $ }}
{{ . | nindent 12 }}
{{- end }}
          ports:
            - name: health
              containerPort: {{ $.Values.worker.healthPort }}
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/dagu
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml $resources | nindent 12 }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          {{- if $dataSizeLimit }}
          emptyDir:
            sizeLimit: {{ $dataSizeLimit | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          configMap:
            name: {{ include "dagu.componentName" (dict "root" $ "component" "config") }}
{{- end }}
{{- end }}
