working_dir: .
steps:
  - id: c
    action: archive.create
    with:
      source: srcdir
      destination: out.zip
  - id: e
    depends: c
    action: archive.extract
    with:
      source: out.zip
      destination: extracted
      preserve_paths: false
  - id: r
    depends: e
    action: file.read
    with:
      path: extracted/deep.txt
