steps:
  - action: sftp.download
    with:
      host: example.invalid
      user: deploy
      password: { secret: sftp/password }
      bastion:
        host: jump.example.invalid
        key: { secret: sftp/jump-key }
        passphrase: { secret: sftp/jump-passphrase }
      source: /remote/file.txt
      destination: file.txt
