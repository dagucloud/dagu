env:
  - SSH_PORT: ${SSH_PORT}
steps:
  - name: upload
    action: sftp.upload
    with:
      host: 127.0.0.1
      port: $SSH_PORT
      user: sshtest
      password: sshtestpass
      strict_host_key: false
      direction: upload
      source: upload_source.txt
      destination: /home/sshtest/uploaded_explicit_direction.txt
  - name: readback
    depends: upload
    action: ssh.run
    with:
      host: 127.0.0.1
      port: $SSH_PORT
      user: sshtest
      password: sshtestpass
      strict_host_key: false
      command: cat /home/sshtest/uploaded_explicit_direction.txt
