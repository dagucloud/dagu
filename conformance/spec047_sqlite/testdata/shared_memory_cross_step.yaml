steps:
  - name: write
    action: sqlite.query
    with:
      dsn: ":memory:"
      shared_memory: true
      query: "CREATE TABLE t(id int); INSERT INTO t VALUES (1)"
  - name: read
    depends: write
    action: sqlite.query
    with:
      dsn: ":memory:"
      shared_memory: true
      query: "SELECT * FROM t"
