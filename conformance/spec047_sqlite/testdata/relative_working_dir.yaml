working_dir: work
steps:
  - name: setup
    action: sqlite.query
    with:
      dsn: "file:./app.db"
      query: "CREATE TABLE users(id int primary key, name text)"
  - name: import
    depends: setup
    action: sqlite.import
    with:
      dsn: "file:./app.db"
      import:
        input_file: users.csv
        table: users
  - name: export
    depends: import
    action: sqlite.query
    with:
      dsn: "file:./app.db"
      query: "SELECT name FROM users"
      streaming: true
      output_file: out/users.jsonl
