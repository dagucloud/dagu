working_dir: .
steps:
  - name: pick
    action: router.route
    stdout: route.txt
    with:
      value: "abc"
      routes:
        "num:>=0.9": [auto_approve]
        abc: [exact_match]
  - name: auto_approve
    run: echo approve > auto_approve.out
  - name: exact_match
    run: echo exact > exact_match.out
