working_dir: .
env:
  - LLM_BASE_URL: ${LLM_BASE_URL}
llm:
  provider: local
  model: test-model
  base_url: ${LLM_BASE_URL}
steps:
  - id: note
    action: computer.run
    with:
      cache: false
      screenshots: final
      do:
        - launch: notepad.exe
        - wait: 3s
        - act: Type the greeting and save it to the file the task names
        - extract:
            instruction: The text in the Notepad window
            schema:
              type: object
              properties:
                text: {type: string}
  - id: record
    depends: note
    run: echo "${steps.note.outputs.text}" > extracted.out
