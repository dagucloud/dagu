working_dir: .
env:
  - LLM_BASE_URL: ${LLM_BASE_URL}
  - TIER: ${TIER}
  - CUSTOMER: ${CUSTOMER}
  - MCP_URL: ${MCP_URL}
steps:
  - action: chat.completion
    stdout: result.out
    with:
      prompt: help the customer
      provider: local
      model: test-model
      base_url: $LLM_BASE_URL
      max_tools: 1
      dags:
        - name: lookup
        - name: refund
---
name: lookup
description: Look up a customer
params: [CUSTOMER_ID]
steps:
  - command: echo "customer=$CUSTOMER_ID"
    output: INFO
---
name: refund
description: Refund a customer
params: [CUSTOMER_ID, AMOUNT]
steps:
  - command: echo "refund $AMOUNT to $CUSTOMER_ID"
    output: RESULT
---
name: invoice
description: Create an invoice
params: [CUSTOMER_ID]
steps:
  - command: echo "invoice for $CUSTOMER_ID"
    output: RESULT
