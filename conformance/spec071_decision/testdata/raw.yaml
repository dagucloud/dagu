type: graph
working_dir: .
env:
  ENDPOINT: ${ENDPOINT}
  PROVIDER: ${PROVIDER}
  MESSAGE: Refund please
secrets:
  - name: DECISION_KEY
    provider: env
    key: DECISION_KEY
steps:
  - id: classify
    action: decision.evaluate
    stdout: response.json
    with:
      provider: ${env.PROVIDER}
      base_url: ${env.ENDPOINT}
      api_key_name: DECISION_KEY
      model: jev-test
      state:
        message: ${env.MESSAGE}
        count: 2
        active: true
      questions:
        department:
          type: choice
          instructions: Which department?
          criteria:
            billing: Charges
            other: null
        urgency:
          type: score
          instructions: How urgent?
          criteria: [Routine, Soon, Now]
        refund:
          type: noul
          instructions: Refund requested?
    output: RESULT
  - id: consume
    depends: classify
    action: log.write
    stdout: actual.txt
    with:
      message: ${RESULT.answers.department.choice}|${RESULT.answers.urgency.score}|${RESULT.answers.refund.noul}
