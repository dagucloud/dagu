env:
  - SMTP_HOST: ${SMTP_HOST}
  - SMTP_PORT: ${SMTP_PORT}
  - SMTP_USER: ${SMTP_USER}
  - SMTP_PASSWORD: ${SMTP_PASSWORD}
smtp:
  host: $SMTP_HOST
  port: $SMTP_PORT
  username: $SMTP_USER
  password: $SMTP_PASSWORD
steps:
  - action: mail.send
    with:
      from: sender@example.com
      to: recipient@example.com
      subject: Authenticated Send
      message: hello authenticated
