env:
  - S3_ENDPOINT: ${S3_ENDPOINT}
  - S3_BUCKET: ${S3_BUCKET}
working_dir: .
s3:
  endpoint: $S3_ENDPOINT
  force_path_style: true
  access_key_id: wrongkey
  secret_access_key: wrongsecret
  bucket: $S3_BUCKET
steps:
  - action: s3.download
    with:
      key: whatever.txt
      destination: out.txt
