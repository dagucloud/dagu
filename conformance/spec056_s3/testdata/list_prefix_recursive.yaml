env:
  - S3_ENDPOINT: ${S3_ENDPOINT}
  - S3_BUCKET: ${S3_BUCKET}
working_dir: .
s3:
  endpoint: $S3_ENDPOINT
  force_path_style: true
  access_key_id: minioadmin
  secret_access_key: minioadminpass
  bucket: $S3_BUCKET
steps:
  - id: up1
    action: s3.upload
    with:
      key: a/1.txt
      source: source.txt
  - id: up2
    depends: up1
    action: s3.upload
    with:
      key: a/2.txt
      source: source.txt
  - id: up3
    depends: up2
    action: s3.upload
    with:
      key: a/nested/3.txt
      source: source.txt
  - id: list
    depends: up3
    action: s3.list
    with:
      prefix: a/
      recursive: true
