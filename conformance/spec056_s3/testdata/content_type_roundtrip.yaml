env:
  - S3_ENDPOINT: ${S3_ENDPOINT}
  - S3_BUCKET: ${S3_BUCKET}
working_dir: .
s3:
  endpoint: $S3_ENDPOINT
  force_path_style: true
  access_key_id: minioadmin
  secret_access_key: minioadminpass
  bucket: $S3_BUCKET
steps:
  - id: up
    action: s3.upload
    with:
      key: ct-test.bin
      source: source.txt
      content_type: application/x-custom
  - id: down
    depends: up
    action: s3.download
    with:
      key: ct-test.bin
      destination: ct-test-out.bin
