# The same coordinator, with small limits of the relay (Spec 093, "Configuration").
peer:
  insecure: false
  cert_file: tls/coordinator.crt
  key_file: tls/coordinator.key
  client_ca_file: tls/dagu-ca.crt
coordinator:
  worker_pools:
    - name: agent-claude
      identities: [agent-claude]
      labels:
        agent.provider.claude: "true"
    - name: general
      identities: [general-worker]
      labels:
        zone: "*"
  dispatchers: [coordinator]
ai:
  relay:
    max_request_bytes: 2048
    max_response_bytes: 4096
