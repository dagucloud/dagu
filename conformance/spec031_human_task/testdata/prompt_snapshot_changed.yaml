name: spec031_prompt_snapshot
working_dir: .
steps:
  - id: review
    action: human.task
    with:
      prompt: This prompt must not replace the stored prompt
      form:
        type: object
        properties:
          region:
            type: string
        required: [region]

  - id: record
    depends: review
    run: printf 'changed\n'
    stdout: snapshot.txt
