name: spec031_push_back_harness
working_dir: .
harnesses:
  recorder:
    binary: sh
    prefix_args: [./record_prompt.sh]
    prompt_mode: arg
steps:
  - id: implement
    action: harness.run
    with:
      provider: recorder
      prompt: implement the change

  - id: review
    depends: implement
    action: human.task
    with:
      prompt: Review the implementation
      push_back:
        rewind_to: implement
        form:
          type: object
          required: [feedback]
          properties:
            feedback:
              type: string

  - id: publish
    depends: review
    action: harness.run
    with:
      provider: recorder
      prompt: publish the change
