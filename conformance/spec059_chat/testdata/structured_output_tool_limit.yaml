working_dir: .
env:
  - LLM_BASE_URL: ${LLM_BASE_URL}
steps:
  - action: chat.completion
    stdout: answer.out
    with:
      prompt: "Keep calling the tool forever."
      provider: local
      model: test-model
      base_url: $LLM_BASE_URL
      tools:
        - loop-tool
      max_tool_iterations: 2
    output_schema:
      type: object
      properties:
        done:
          type: boolean
---
name: loop-tool
steps:
  - command: echo "ok"
