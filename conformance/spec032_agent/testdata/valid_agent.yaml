type: agent
llm:
  provider: anthropic
  model: claude-opus-5
  system: |
    Drive the workflow until every task is complete.
steps:
  - name: design
    action: dag.run
    with:
      dag: design
  - id: review
    name: review
    action: human.task
    with:
      prompt: Approve the design?
      form:
        type: object
        properties:
          approved:
            type: boolean
        required: [approved]
tasks:
  - name: designed
    description: Finished when the design workflow ran and a person approved it.
---
name: design
steps:
  - name: draft
    run: echo drafting
