type: graph
working_dir: .
preconditions:
  - condition: "false"
handler_on:
  init:
    run: printf 'init\n' > init-ran.txt
  abort:
    run: printf 'abort\n' > abort-handler.txt
loop:
  until: printf 'condition\n' > loop-condition-ran.txt
  max_iterations: 2
steps:
  - id: work
    run: printf 'step\n' > loop-step-ran.txt
