type: graph
working_dir: .
handler_on:
  success:
    run: printf 'success\n' > success-handler.txt
  failure:
    run: printf 'failure\n' > failure-handler.txt
  exit:
    run: printf 'exit\n' > exit-handler.txt
loop:
  until: test -f never.flag
  max_iterations: 2
steps:
  - id: work
    run: printf 'x\n' >> exhaustion-fail-count.txt
