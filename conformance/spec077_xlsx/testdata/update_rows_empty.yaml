working_dir: .
steps:
  - id: write
    action: xlsx.write
    with:
      path: orders.xlsx
      columns: [Invoice No, Status]
      rows:
        - {"Invoice No": "INV-1", "Status": "Open"}
  - id: update
    depends: write
    action: xlsx.update_rows
    with:
      path: orders.xlsx
      key: _row
      rows: '[]'
      set: {Status: status, Result: result}
  - id: update_default
    depends: update
    action: xlsx.update_rows
    with:
      path: orders.xlsx
      key: Invoice No
      rows: '[]'
  - id: read
    depends: update_default
    action: xlsx.read
    with:
      path: orders.xlsx
  - id: out
    depends: read
    action: file.write
    with:
      path: out.json
      content: '{"changes": ${steps.update.outputs.changes}, "default_changes": ${steps.update_default.outputs.changes}, "headers": ${steps.read.outputs.headers}, "rows": ${steps.read.outputs.rows}}'
