working_dir: .
steps:
  - id: write
    action: xlsx.write
    with:
      path: orders.xlsx
      sheet: Orders
      columns: [Item, Qty]
      rows: [{"Item": "pear", "Qty": 3}]
  - id: csv
    depends: write
    action: xlsx.convert
    with:
      path: orders.xlsx
      output: null_encoding.csv
      encoding:
