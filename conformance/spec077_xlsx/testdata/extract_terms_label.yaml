name: quote-extract
working_dir: .
env:
  - LLM_BASE_URL: ${LLM_BASE_URL}
llm:
  provider: local
  model: test-model
  base_url: ${LLM_BASE_URL}
steps:
  - id: form
    action: xlsx.write
    with:
      path: quote.xlsx
      header: false
      style: none
      rows:
        - ["御見積書", null, null]
        - ["見積番号", "Q-2026-005", null]
        - ["納期", "2026-12-10", null]
        - ["合計金額", 78000, null]
        - ["支払条件", "月末締翌月末払", "振込"]
  - id: fields
    depends: form
    action: xlsx.extract
    with:
      path: quote.xlsx
      instruction: A supplier's quote. Find the quote number, the delivery date, the total amount, and the payment terms.
      schema:
        type: object
        properties:
          quote_no: {type: string, description: 見積番号}
          delivery: {type: string, format: date, description: 納期}
          total: {type: number, description: 合計金額}
          terms: {type: string, description: 支払条件}
  - id: out
    depends: fields
    action: file.write
    with:
      path: out.json
      overwrite: true
      content: '{"quote_no": "${steps.fields.outputs.quote_no}", "total": ${steps.fields.outputs.total}, "terms": "${steps.fields.outputs.terms}", "cells": ${steps.fields.outputs.cells}, "source": "${steps.fields.outputs.source}"}'
