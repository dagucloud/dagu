working_dir: .
steps:
  - id: write
    action: xlsx.write
    with:
      path: orders.xlsx
      columns: [Item, Amount]
      rows: [{"Item": "pear", "Amount": "N/A"}]
  - id: csv
    depends: write
    action: xlsx.convert
    with:
      path: orders.xlsx
      output: out.csv
      types: {Amount: number}
