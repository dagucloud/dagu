working_dir: .
env:
  - LLM_BASE_URL: ${LLM_BASE_URL}
secrets:
  - name: SUPPLIER_TOKEN
    provider: env
    key: SUPPLIER_TOKEN
llm:
  provider: local
  model: test-model
  base_url: ${LLM_BASE_URL}
steps:
  - id: form
    action: xlsx.write
    with:
      path: quote.xlsx
      header: false
      rows: [["見積番号", "Q-1"]]
  - id: fields
    depends: form
    action: xlsx.extract
    with:
      path: quote.xlsx
      instruction: Use token ${SUPPLIER_TOKEN} and find the quote number.
      schema:
        type: object
        properties:
          quote_no: {type: string}
  - id: after
    depends: fields
    action: file.write
    with:
      path: after.txt
      content: ran
