working_dir: .
steps:
  - id: write
    action: xlsx.write
    with:
      path: orders.xlsx
      input: input.csv
      encoding: cp932
      delimiter: ";"
  - id: read
    depends: write
    action: xlsx.read
    with:
      path: orders.xlsx
  - id: out
    depends: read
    action: file.write
    with:
      path: out.json
      content: '{"headers": ${steps.read.outputs.headers}, "rows": ${steps.read.outputs.rows}}'
