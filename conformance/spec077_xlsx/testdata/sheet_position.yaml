working_dir: .
steps:
  - id: write
    action: xlsx.write
    with:
      path: report.xlsx
      sheet: Template
      columns: [Item]
      rows: [{"Item": "Rent"}]
  - id: add
    depends: write
    action: xlsx.sheet
    with:
      path: report.xlsx
      operation: add
      sheet: Notes
      position: 5
