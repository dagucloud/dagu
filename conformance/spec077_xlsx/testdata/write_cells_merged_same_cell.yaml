working_dir: .
steps:
  - id: template
    action: xlsx.write
    with:
      path: template.xlsx
      header: false
      rows: [["Title"]]
  - id: fill
    depends: template
    action: xlsx.write_cells
    with:
      path: template.xlsx
      merge: [B10:D10]
      cells: {B10: notes, C10: more}
