working_dir: .
steps:
  - id: template
    action: xlsx.write
    with:
      path: template.xlsx
      header: false
      rows: [["Customer", ""]]
  - id: fill
    depends: template
    action: xlsx.write_cells
    with:
      path: template.xlsx
      cells: {B1: Acme}
      dry_run: true
  - id: read
    depends: fill
    action: xlsx.read
    with:
      path: template.xlsx
      header: false
  - id: out
    depends: read
    action: file.write
    with:
      path: out.json
      content: '{"dry_run": ${steps.fill.outputs.dry_run}, "changes": ${steps.fill.outputs.changes}, "rows": ${steps.read.outputs.rows}}'
