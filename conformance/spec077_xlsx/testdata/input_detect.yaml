working_dir: .
steps:
  - id: write
    action: xlsx.write
    with:
      path: detected.xlsx
      input: detect_input.csv
  - id: read
    depends: write
    action: xlsx.read
    with:
      path: detected.xlsx
  - id: out
    depends: read
    action: file.write
    with:
      path: out.json
      content: '{"headers": ${steps.read.outputs.headers}, "rows": ${steps.read.outputs.rows}}'
