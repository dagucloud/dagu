working_dir: .
steps:
  - id: write
    action: xlsx.write
    with:
      path: orders.xlsx
      columns: [Invoice No, Amount]
      rows: [{"Invoice No": "INV-1", "Amount": 10}, {"Invoice No": "INV-1", "Amount": "N/A"}]
  - id: check
    depends: write
    action: xlsx.validate
    stderr: check.err
    with:
      path: orders.xlsx
      unique: [Invoice No]
      types: {Amount: number}
      on_problem: fail
  - id: after
    depends: check
    action: file.write
    with:
      path: after.txt
      content: ran
