working_dir: .
steps:
  - id: write
    action: xlsx.write
    with:
      path: orders.xlsx
      columns: [Invoice No, Status]
      rows: [{"Invoice No": "INV-1", "Status": ""}]
  - id: mark
    depends: write
    action: xlsx.update_rows
    with:
      path: orders.xlsx
      key: Invoice No
      missing: append
      rows: [{"Invoice No": "INV-9", "Status": "New"}, {"Invoice No": "INV-1", "Status": "Seen"}]
  - id: changes
    depends: mark
    action: file.write
    with:
      path: changes.json
      content: ${steps.mark.outputs.changes}
