working_dir: .
steps:
  - id: template
    action: xlsx.write
    with:
      path: template.xlsx
      header: false
      rows: [["Customer", ""], ["Date", ""], ["Qty", 2], ["Price", 10], ["Total", "old"]]
  - id: fill
    depends: template
    action: xlsx.write_cells
    with:
      path: template.xlsx
      cells:
        B1: Acme
        B2: "2026-10-01"
        B3: null
        B4: 10
        Sheet1!B5: {formula: "=B3*B4"}
  - id: changes
    depends: fill
    action: file.write
    with:
      path: changes.json
      content: ${steps.fill.outputs.changes}
  - id: read
    depends: fill
    action: xlsx.read
    with:
      path: template.xlsx
      header: false
      formulas: text
  - id: out
    depends: read
    action: file.write
    with:
      path: out.json
      content: ${steps.read.outputs.rows}
