working_dir: .
# 70 KiB leaves a 6 KiB budget for rows: 64 KiB is reserved.
max_output_size: 71680
steps:
  - id: write
    action: xlsx.write
    with:
      path: wide.xlsx
      input: wide.csv
  - id: read
    depends: write
    action: xlsx.read
    with:
      path: wide.xlsx
  - id: out
    depends: read
    action: file.write
    with:
      path: out.json
      content: '{"count": ${steps.read.outputs.count}, "truncated": ${steps.read.outputs.truncated}, "warnings": ${steps.read.outputs.warnings}}'
