working_dir: .
steps:
  - id: w1
    action: file.write
    with:
      path: listroot/top.txt
      content: "1"
      create_dirs: true
  - id: w2
    depends: w1
    action: file.write
    with:
      path: listroot/nested/deep.txt
      content: "2"
      create_dirs: true
  - id: l
    depends: w2
    action: file.list
    with:
      path: listroot
