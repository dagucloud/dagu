working_dir: .
preconditions:
  - condition: test -f root-ready.flag
handler_on:
  init:
    run: printf '%s\n' init > init-ran.txt
  abort:
    run: printf '%s\n' abort > abort-ran.txt
  failure:
    run: printf '%s\n' failure > failure-ran.txt
steps:
  - id: main
    run: printf '%s\n' main > main-ran.txt
