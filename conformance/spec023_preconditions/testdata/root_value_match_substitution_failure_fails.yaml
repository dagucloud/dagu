name: root_substitution_failure
working_dir: .
preconditions:
  - condition: '$(printf "%s\n" root-error >&2; exit 7)'
    expected: ready
handler_on:
  init:
    run: printf '%s\n' init > init-ran.txt
  abort:
    run: printf '%s\n' abort > abort-ran.txt
  failure:
    run: printf '%s\n' failure > failure-ran.txt
steps:
  - id: main
    run: printf '%s\n' main > main-ran.txt
