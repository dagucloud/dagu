# The coordinator, the scheduler and the server of the test of one agent run.
# The test writes the certificates in tls/. The pools are the pools of the
# example of Spec 092.
peer:
  insecure: false
  cert_file: tls/coordinator.crt
  key_file: tls/coordinator.key
  client_ca_file: tls/dagu-ca.crt
coordinator:
  worker_pools:
    - name: agent-claude
      identities: [agent-claude]
      labels:
        agent.provider.claude: "true"
    - name: general
      identities: [general-worker]
      labels:
        zone: "*"
  # The server, the scheduler and the command line of the test use the
  # certificate of the coordinator, so its identity is the dispatcher.
  dispatchers: [coordinator]
