# The configuration of the general worker of the test of one agent run. The
# certificate has the identity general-worker, which is in the pool general.
peer:
  insecure: false
  cert_file: tls/general-worker.crt
  key_file: tls/general-worker.key
  client_ca_file: tls/dagu-ca.crt
worker:
  labels:
    zone: eu
env_passthrough_prefixes: [SPEC092_]
