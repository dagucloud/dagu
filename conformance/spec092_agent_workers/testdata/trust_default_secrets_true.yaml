# A step that is untrusted cannot list secrets, also in a DAG with an agent.run step.
secrets:
  - name: GIT_TOKEN
    provider: env
    key: SPEC092_GIT_TOKEN
steps:
  - id: code
    action: agent.run
    with:
      provider: claude
      endpoint:
        name: test-endpoint
        model: claude-test
      prompt: Fix the failing test.
  - id: push
    depends: [code]
    untrusted: true
    secrets: [GIT_TOKEN]
    run: echo push
