# A step that lists secrets must have untrusted: false in a DAG with an agent.run step.
# Secrets do not make the step trusted, so the DAG does not load.
secrets:
  - name: GIT_TOKEN
    provider: env
    key: SPEC092_GIT_TOKEN
steps:
  - id: code
    action: agent.run
    with:
      provider: claude
      endpoint:
        name: test-endpoint
        model: claude-test
      prompt: Fix the failing test.
  - id: push
    depends: [code]
    secrets: [GIT_TOKEN]
    run: echo push
