secrets:
  - name: GIT_TOKEN
    provider: env
    key: SPEC092_GIT_TOKEN
steps:
  - id: plain
    run: |
      if env | grep -q '^GIT_TOKEN='; then echo "plain:has-secret"; exit 1; fi
      echo "plain:no-secret"
      if env | grep -q '^DAGU_SPEC092_MARKER='; then echo "plain:has-dagu-marker"; fi

  - id: listed
    depends: [plain]
    secrets: [GIT_TOKEN]
    run: |
      test "$GIT_TOKEN" = "spec092-token-value"
      echo "listed:has-secret"

  - id: verify
    depends: [listed]
    untrusted: true
    run: |
      if env | grep -q '^GIT_TOKEN='; then echo "untrusted:has-secret"; exit 1; fi
      if env | grep '^DAGU_' | grep -vq '^DAGU_OUTPUT_FILE='; then echo "untrusted:has-dagu"; exit 1; fi
      test -n "$DAGU_OUTPUT_FILE"
      echo "verdict=clean" > "$DAGU_OUTPUT_FILE"
      echo "untrusted:clean"
    outputs:
      - name: verdict

  - id: report
    depends: [verify]
    env:
      - VERDICT: ${steps.verify.outputs.verdict}
    run: echo "verdict:$VERDICT"
