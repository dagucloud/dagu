working_dir: .
env:
  - FAKE_CLAUDE_DIR: ${FAKE_CLAUDE_DIR}
  - FAKE_CLAUDE_SCENARIO: ${FAKE_CLAUDE_SCENARIO}
  - TIER: ${TIER}
steps:
  - id: review
    action: agent.run
    stdout: review.out
    stderr: review.err
    with:
      provider: claude
      endpoint:
        name: test-endpoint
        model: claude-test
      prompt: Help the customer.
      system: Be brief.
      skills:
        - tone
        - refund-policy
        - gold
