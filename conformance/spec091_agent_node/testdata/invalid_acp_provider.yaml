harnesses:
  acp-agent:
    protocol: acp
    binary: codex-acp
working_dir: .
env:
  - LLM_BASE_URL: ${LLM_BASE_URL}
  - FAKE_CLAUDE_DIR: ${FAKE_CLAUDE_DIR}
  - FAKE_CLAUDE_SCENARIO: ${FAKE_CLAUDE_SCENARIO}
steps:
  - id: review
    action: agent.run
    with:
      provider: acp-agent
      prompt: "Say hello."
