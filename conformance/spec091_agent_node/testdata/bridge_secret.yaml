working_dir: .
env:
  - FAKE_CLAUDE_DIR: ${FAKE_CLAUDE_DIR}
  - FAKE_CLAUDE_SCENARIO: ${FAKE_CLAUDE_SCENARIO}
steps:
  - id: review
    action: agent.run
    stdout: review.out
    stderr: review.err
    with:
      provider: claude
      endpoint:
        name: test-endpoint
        model: claude-test
      prompt: Help the customer.
      dags:
        - name: lookup
---
name: lookup
description: Look up a customer
params: [CUSTOMER_ID]
steps:
  - command: echo "customer=$CUSTOMER_ID"
    output: INFO
