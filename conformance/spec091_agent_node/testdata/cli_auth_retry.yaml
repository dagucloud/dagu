working_dir: .
env:
  - LLM_BASE_URL: ${LLM_BASE_URL}
  - PATCH_ID: p-42
  - FAKE_CLAUDE_DIR: ${FAKE_CLAUDE_DIR}
  - FAKE_CLAUDE_SCENARIO: ${FAKE_CLAUDE_SCENARIO}
steps:
  - id: review
    action: agent.run
    stderr: review.err
    retry_policy:
      limit: 2
      interval_sec: 1
    with:
      provider: claude
      endpoint:
        name: test-endpoint
        model: claude-test
      prompt: "Say hello."
