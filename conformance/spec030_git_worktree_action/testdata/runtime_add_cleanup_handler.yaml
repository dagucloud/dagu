working_dir: .
handler_on:
  exit:
    working_dir: ./wt/cleanup-handler
    run: printf 'worktree visible to exit handler'
    stdout: ../../handler-saw-worktree.txt
steps:
  - id: add
    working_dir: ./repo
    action: git.worktree.add
    with:
      branch: cleanup-handler
      create_branch: true
      path: ../wt/cleanup-handler
      cleanup: on_success
    stderr: ../action-stderr.txt

  - id: capture
    depends: add
    run: |
      printf '%s\n' \
        'path=${steps.add.outputs.path}' \
        'branch=${steps.add.outputs.branch}' \
        'commit=${steps.add.outputs.commit}' \
        'worktree_created=${steps.add.outputs.worktree_created}' \
        'branch_created=${steps.add.outputs.branch_created}'
    stdout: action-outputs.txt
