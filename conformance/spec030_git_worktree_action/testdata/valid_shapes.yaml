working_dir: ./missing-repository
steps:
  - id: add-minimal
    action: git.worktree.add
    with:
      branch: missing-branch

  - id: add-all-fields
    action: git.worktree.add
    with:
      branch: missing-branch
      path: ./missing-worktree
      create_branch: true
      base: missing-base

  - id: remove-by-branch
    action: git.worktree.remove
    with:
      branch: missing-branch

  - id: remove-by-path
    action: git.worktree.remove
    with:
      path: ./missing-worktree

  - id: remove-by-both
    action: git.worktree.remove
    with:
      branch: missing-branch
      path: ./missing-worktree
      force: true
      delete_branch: true
      force_delete_branch: true
