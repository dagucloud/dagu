params:
  - name: working_dir
    type: string
    required: true
  - name: base
    type: string
    required: true
working_dir: .
steps:
  - id: add
    working_dir: "${params.working_dir}"
    action: git.worktree.add
    with:
      base: "${params.base}"
    stdout: ../action-stdout.json
    stderr: ../action-stderr.txt
