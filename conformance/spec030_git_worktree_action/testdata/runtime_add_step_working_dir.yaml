working_dir: .
steps:
  - id: add
    working_dir: ./repo
    action: git.worktree.add
    with:
      branch: step-directory
      create_branch: true
      path: ../workspace/wt/step-directory
    stderr: ../action-stderr.txt

  - id: capture
    depends: add
    type: template
    script: |
      path=${steps.add.outputs.path}
      branch=${steps.add.outputs.branch}
      commit=${steps.add.outputs.commit}
      worktree_created=${steps.add.outputs.worktree_created}
      branch_created=${steps.add.outputs.branch_created}
    stdout: action-outputs.txt
