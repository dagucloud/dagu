params:
  - name: working_dir
    type: string
    required: true
  - name: path
    type: string
    required: true
working_dir: .
steps:
  - id: remove
    working_dir: "${params.working_dir}"
    action: git.worktree.remove
    with:
      path: "${params.path}"
    stdout: ../action-stdout.json
    stderr: ../action-stderr.txt
