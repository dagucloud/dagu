params:
  - name: repository
    type: string
    required: true
  - name: path
    type: string
    required: true
working_dir: .
steps:
  - id: remove
    action: git.worktree_remove
    with:
      repository: "${params.repository}"
      path: "${params.path}"
    stdout: action-stdout.json
    stderr: action-stderr.txt
