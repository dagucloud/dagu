params:
  - name: working_dir
    type: string
    required: true
  - name: branch
    type: string
    required: true
  - name: path
    type: string
    required: true
  - name: first_cleanup
    type: string
    required: true
  - name: second_cleanup
    type: string
    required: true
working_dir: .
steps:
  - id: first_add
    working_dir: "${params.working_dir}"
    action: git.worktree.add
    with:
      branch: "${params.branch}"
      create_branch: true
      path: "${params.path}"
      cleanup: "${params.first_cleanup}"

  - id: remove
    depends: first_add
    working_dir: "${params.working_dir}"
    action: git.worktree.remove
    with:
      branch: "${params.branch}"
      path: "${params.path}"

  - id: second_add
    depends: remove
    working_dir: "${params.working_dir}"
    action: git.worktree.add
    with:
      branch: "${params.branch}"
      path: "${params.path}"
      cleanup: "${params.second_cleanup}"

  - id: fail
    depends: second_add
    run: exit 1
