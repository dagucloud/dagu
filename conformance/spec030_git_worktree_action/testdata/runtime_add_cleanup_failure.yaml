params:
  - name: working_dir
    type: string
    required: true
  - name: branch
    type: string
    required: true
  - name: path
    type: string
    required: true
  - name: cleanup
    type: string
    required: true
working_dir: .
steps:
  - id: add
    working_dir: "${params.working_dir}"
    action: git.worktree.add
    with:
      branch: "${params.branch}"
      create_branch: true
      path: "${params.path}"
      cleanup: "${params.cleanup}"
    stderr: ../action-stderr.txt

  - id: fail
    depends: add
    run: exit 1
