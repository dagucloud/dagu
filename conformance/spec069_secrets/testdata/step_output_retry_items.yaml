working_dir: .
secrets:
  - name: API_TOKEN
    provider: file
    key: file_secret.txt
steps:
  - id: login
    run: |
      printf 'login\n' >> logins.out
      printf '%s\n' "$API_TOKEN"
    output: TOKEN

  - id: use
    depends: login
    foreach:
      items: ["${TOKEN}"]
      steps:
        - id: body
          run: |
            if [ '${foreach.item}' = "$API_TOKEN" ]; then
              printf 'real\n' >> received.out
            else
              printf '%s\n' '${foreach.item}' >> received.out
            fi
            [ -f ready ]
