working_dir: .
env:
  - SSH_PORT: ${SSH_PORT}
steps:
  - name: remote
    action: ssh.run
    with:
      host: 127.0.0.1
      port: $SSH_PORT
      user: sshtest
      password: sshtestpass
      strict_host_key: false
      command: echo captured
    output: OUT
  - name: dump
    depends: remote
    run: printf '%s' "${OUT}" > out.txt
