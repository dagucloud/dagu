# deploy runs deploy-one on each web node, one at a time. A node's run writes
# started-<node> to DIR, waits for go-<node>, and then writes ran-<node>.
working_dir: .
params:
  - DIR: ""
steps:
  - id: deploy
    action: dag.run
    stdout: nodes.json
    with:
      dag: deploy-one
      params:
        DIR: ${params.DIR}
    nodes: web
---
name: deploy-one
node: required
params:
  - DIR: ""
steps:
  - id: start
    action: file.write
    with:
      path: ${params.DIR}/started-${node.name}
      content: started
      overwrite: true
  - id: gate
    depends: [start]
    action: wait.file
    with:
      path: ${params.DIR}/go-${node.name}
      poll_interval: 100ms
  - id: mark
    depends: [gate]
    action: file.write
    with:
      path: ${params.DIR}/ran-${node.name}
      content: ran
      overwrite: true
