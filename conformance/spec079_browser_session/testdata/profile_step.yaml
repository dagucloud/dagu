working_dir: .
env:
  - SHOP_URL: ${SHOP_URL}
  - LLM_BASE_URL: ${LLM_BASE_URL}
llm:
  provider: local
  model: test-model
  base_url: ${LLM_BASE_URL}
steps:
  - id: visit
    action: browser.run
    with:
      url: ${SHOP_URL}/login
      browser:
        profile: portal
      do:
        - expect:
            text: Sign in
