description: A chat step with an endpoint and a named MCP server.
working_dir: .
steps:
  - id: ask
    action: chat.completion
    stdout: result.out
    with:
      endpoint:
        name: test-endpoint
        model: claude-test
      stream: false
      prompt: Search the docs for dagu.
      tools:
        mcp:
          - name: docs
            allow: [search]
