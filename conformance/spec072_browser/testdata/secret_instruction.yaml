working_dir: .
env:
  - SHOP_URL: ${SHOP_URL}
  - LLM_BASE_URL: ${LLM_BASE_URL}
secrets:
  - name: SHOP_TOKEN
    provider: env
    key: SHOP_TOKEN
llm:
  provider: local
  model: test-model
  base_url: ${LLM_BASE_URL}
steps:
  - id: login
    action: browser.run
    with:
      url: ${SHOP_URL}
      do:
        - act: Type ${SHOP_TOKEN} into the token field
