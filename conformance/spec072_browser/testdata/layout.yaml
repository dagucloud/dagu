working_dir: .
params:
  - BANNER: "0"
env:
  - SHOP_URL: ${SHOP_URL}
  - LLM_BASE_URL: ${LLM_BASE_URL}
llm:
  provider: local
  model: test-model
  base_url: ${LLM_BASE_URL}
steps:
  - id: save
    action: browser.run
    with:
      url: ${SHOP_URL}/layout?banner=${BANNER}
      do:
        - act: Click the Save button
        - expect: {text: "Saved"}
