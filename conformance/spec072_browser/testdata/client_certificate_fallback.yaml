working_dir: .
env:
  - LLM_BASE_URL: ${LLM_BASE_URL}
  - UPSTREAM_PROXY: ${UPSTREAM_PROXY}
  - CERT_PASSPHRASE: ${CERT_PASSPHRASE}
  - OTHER_URL: ${OTHER_URL}
llm:
  provider: local
  model: test-model
  base_url: ${LLM_BASE_URL}
steps:
  - id: other
    action: browser.run
    with:
      browser:
        proxy: ${UPSTREAM_PROXY}
        client_certificates:
          - hosts: [mtls.test]
            pfx_file: client.p12
            passphrase: ${CERT_PASSPHRASE}
            ca_file: ca.pem
      do:
        - goto: ${OTHER_URL}
