working_dir: .
env:
  - SHOP_URL: ${SHOP_URL}
  - LLM_BASE_URL: ${LLM_BASE_URL}
llm:
  provider: local
  model: test-model
  base_url: ${LLM_BASE_URL}
steps:
  - id: rows
    action: browser.run
    with:
      url: ${SHOP_URL}/rows
      do:
        - act: Click the Delete row button
        - expect: {text: "Row deleted"}
