working_dir: .
env:
  - RECEIPTS_URL: ${RECEIPTS_URL}
  - LLM_BASE_URL: ${LLM_BASE_URL}
llm:
  provider: local
  model: test-model
  base_url: ${LLM_BASE_URL}
steps:
  - id: invoices
    run: |
      mkdir -p inbox
      printf 'invoice A' > inbox/a.pdf
      printf 'invoice B' > inbox/b.pdf
      printf '["inbox/a.pdf","inbox/b.pdf"]'
    output: FILES
  - id: file_box
    depends: invoices
    action: browser.run
    with:
      url: ${RECEIPTS_URL}
      do:
        - upload:
            files: ${FILES}
            into: the Choose files button
        - expect: {text: "Upload 1: a.pdf, b.pdf", within: 30s}
        - upload: {files: "inbox/*.pdf"}
        - expect: {text: "Upload 2: a.pdf, b.pdf", within: 30s}
