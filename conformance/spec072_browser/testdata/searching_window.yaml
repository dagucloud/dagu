working_dir: .
env:
  - SHOP_URL: ${SHOP_URL}
  - LLM_BASE_URL: ${LLM_BASE_URL}
llm:
  provider: local
  model: test-model
  base_url: ${LLM_BASE_URL}
steps:
  - id: search
    action: browser.run
    with:
      url: ${SHOP_URL}/bids
      do:
        - act: Click the Choose region button
        - act: Tick the Funabashi checkbox
        - act: Click the Register button
        - expect: {text: Funabashi}
        - act: Click the Search button
        - when: The page shows 'Road repair'
          expect: The page shows 'Road repair in Funabashi'
        - extract:
            instruction: The page heading
            schema:
              type: object
              properties:
                heading:
                  type: string
        - act: Click the Open button
        - expect: {text: Opened}
  - id: record
    depends: search
    run: echo "${steps.search.outputs.heading}" > heading.out
