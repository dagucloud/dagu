working_dir: .
env:
  - SHOP_URL: ${SHOP_URL}
  - LLM_BASE_URL: ${LLM_BASE_URL}
llm:
  provider: local
  model: test-model
  base_url: ${LLM_BASE_URL}
steps:
  # The list turns its pages in place with a button that is gone on the
  # last page.
  - id: orders
    action: browser.run
    with:
      url: ${SHOP_URL}/list
      do:
        - extract:
            instruction: The rows the list shows
            schema:
              type: object
              properties:
                rows:
                  type: array
                  items: {type: string}
            pages:
              next: Click the Next page button
  - id: record
    depends: orders
    run: echo '${steps.orders.outputs.rows}' > rows.out
