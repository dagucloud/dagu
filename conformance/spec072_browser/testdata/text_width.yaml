working_dir: .
env:
  - SHOP_URL: ${SHOP_URL}
  - LLM_BASE_URL: ${LLM_BASE_URL}
llm:
  provider: local
  model: test-model
  base_url: ${LLM_BASE_URL}
steps:
  - id: order
    action: browser.run
    with:
      url: ${SHOP_URL}/order
      do:
        - expect: {text: "ABC123"}
        - screenshot: receipt
          when: {text: "注文番号: ABC123"}
        - screenshot: never
          when: {text: "XYZ"}
  - id: record
    depends: order
    run: ls "$DAG_RUN_ARTIFACTS_DIR/browser/order" > shots.out
