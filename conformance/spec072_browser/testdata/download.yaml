working_dir: .
env:
  - SHOP_URL: ${SHOP_URL}
  - LLM_BASE_URL: ${LLM_BASE_URL}
llm:
  provider: local
  model: test-model
  base_url: ${LLM_BASE_URL}
steps:
  - id: fetch
    action: browser.run
    with:
      url: ${SHOP_URL}
      do:
        - act: Click the Download report link
  - id: check
    depends: fetch
    run: cat "$DAG_RUN_ARTIFACTS_DIR/browser/fetch/downloads/report.csv" > report.out
