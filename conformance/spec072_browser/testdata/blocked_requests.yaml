working_dir: .
env:
  - SHOP_URL: ${SHOP_URL}
  - LLM_BASE_URL: ${LLM_BASE_URL}
llm:
  provider: local
  model: test-model
  base_url: ${LLM_BASE_URL}
steps:
  - id: signin
    action: browser.run
    with:
      url: ${SHOP_URL}/signin
      browser:
        allowed_domains: ["127.0.0.1"]
      do:
        - expect: {text: "Signed in", within: 1s}
