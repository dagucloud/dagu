apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dagu-agent

# The Secret agent-claude-tls is not a resource here: a placeholder Secret must never reach the
# cluster. Make it before you apply this folder:
#
#   kubectl -n dagu-agent create secret generic agent-claude-tls \
#     --from-file=agent-claude.crt --from-file=agent-claude.key --from-file=ca.crt
#
# The Common Name of the certificate MUST be in a pool of coordinator.worker_pools.
resources:
  - namespace.yaml
  - agent-worker.yaml
  - egress-proxy.yaml
  - networkpolicy.yaml
