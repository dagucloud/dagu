# The file's fields handle every source of release.yaml, so each case
# reports only what it changes.
params:
  stamp: "2026-11-23"
mocks:
  build: &build
    outputs:
      image_tag: v1
      manifest: {files: 3}
  gate:
    precondition: met
  poll:
    results:
      - condition: not_met
  ship:
    review:
      decision: approve
      values:
        ticket: REL-1
  sign_off:
    review:
      decision: approve
      values:
        reason: looks good
  fanout: {}
  child: {}
  untitled: {}
  handler_on.failure: {}
cases:
  - name: valid
    expect:
      status: succeeded

  - name: unknown keys
    mocks:
      deplooy: {}
      handler_on.success: {}
      # A handler's runtime name is no key.
      onFailure: {}
    expect:
      status: succeeded

  - name: one step twice
    mocks:
      build: *build
      build image: *build
    expect:
      status: succeeded

  - name: inline fields and results
    mocks:
      untitled:
        exit_code: 1
        results:
          - exit_code: 0
      child:
        results: []
    expect:
      status: succeeded

  - name: missing outputs
    mocks:
      build: {}
    expect:
      status: succeeded

  - name: wrong outputs
    mocks:
      build:
        outputs:
          image_tag: 1
          manifest: [a]
          extra: x
    expect:
      status: succeeded

  - name: outputs per result
    mocks:
      build:
        results:
          # A failed result publishes nothing, but a declared output still
          # takes only a value of its type.
          - exit_code: 1
            outputs:
              image_tag: 42
              extra: x
          - outputs:
              image_tag: v2
    expect:
      status: succeeded

  - name: outputs without id
    mocks:
      untitled:
        outputs:
          count: "1"
    expect:
      status: succeeded

  - name: runtime outputs
    mocks:
      child:
        outputs:
          anything: 1
          bad-name: 2
    expect:
      status: succeeded

  - name: real steps
    real: [fanout, build, deplooy, gate, gate]
    expect:
      status: succeeded

  - name: human task result
    mocks:
      sign_off:
        exit_code: 0
        review:
          decision: approve
          values:
            reason: ok
    expect:
      status: succeeded

  - name: fields without a source
    mocks:
      route:
        precondition: met
        results:
          - condition: met
        review:
          decision: approve
    expect:
      status: succeeded

  - name: bad values
    trigger: subdag
    precondition: met
    mocks:
      gate:
        precondition: maybe
      poll:
        results:
          - condition: sometimes
      ship:
        review:
          decision: later
          values:
            ticket: REL-1
    expect:
      status: succeeded

  - name: review values
    mocks:
      ship:
        review:
          decision: approve
          values:
            ticket: " "
            links: [a]
      sign_off:
        review:
          decision: reject
    expect:
      status: succeeded

  - name: default mock outputs
    default_mock:
      results:
        - outputs:
            image_tag: v1
    expect:
      status: succeeded

  - name: bad expect
    expect:
      status: done
      attempts: -1
      steps:
        deplooy: succeeded
        build:
          status: skippedd
          outputs:
            image_tag: v1
            nope: x
        build image: failed
        gate: {}
        route:
          attempts: -2
          stdout:
            matches: "("
        child:
          outputs:
            anything: 1
      notifications:
        - kind: mail
        - kind: mail_on.failure
          step: build
        - kind: mail_on_error
          step: nope

  - name: empty expect
    expect: {}

  # untitled and handler_on.failure assert what their steps take.
  - name: bad called_with
    expect:
      steps:
        build:
          called_with:
            with:
              tag: v1
        route:
          called_with:
            run: ./route.sh
        child:
          called_with:
            with: {}
            env: {}
        gate:
          called_with:
            run: {}
        poll:
          called_with:
            run:
              matches: "("
        sign_off:
          called_with:
            env:
              REASON: ok
        fanout:
          called_with:
            run: ./one.sh
        ship:
          called_with: {}
        untitled:
          called_with:
            run:
              contains: untitled
            env:
              STAGE: prod
        handler_on.failure:
          called_with:
            with:
              to: oncall@example.com
