steps:
  - name: build image
    id: build
    run: ./build.sh
    outputs:
      - name: tag
    repeat_policy:
      repeat: while
      condition: test -f again
      limit: 3
  - id: form
    action: human.task
    with:
      prompt: Fill it in.
      form:
        type: object
        properties:
          code:
            type: string
            pattern: "^[A-Z]+$"
          tier:
            type: string
            oneOf:
              - const: gold
              - const: silver
          urgent:
            type: boolean
          count:
            type: number
          note:
            type: string
            default: none
        required: [code, tier, urgent, count, note]
  - id: fanout
    foreach:
      items: [a]
      steps:
        - id: one
          run: ./one.sh
  - id: gate
    action: noop
    preconditions:
      - condition: test -f ready
