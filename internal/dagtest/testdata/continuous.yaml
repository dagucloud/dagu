steps:
  - id: heartbeat
    action: log.write
    with:
      message: alive
    repeat_policy:
      repeat: while
      interval_sec: 1
  - id: probe
    run: ./probe.sh
    repeat_policy:
      repeat: while
      interval_sec: 1
  - id: retry_log
    action: log.write
    with:
      message: bounded
    repeat_policy:
      repeat: while
      interval_sec: 1
      limit: 3
