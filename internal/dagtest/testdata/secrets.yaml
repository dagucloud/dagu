secrets:
  - name: API_TOKEN
    provider: env
    key: DAGU_TEST_UNSET_TOKEN
  - name: DB_PASSWORD
    provider: env
    key: DAGU_TEST_UNSET_PASSWORD
ssh:
  user: deploy
  host: app.invalid
  key: {secret: ssh/deploy-key}
steps:
  - id: remote
    action: ssh.run
    with:
      host: app.invalid
      command: "true"
      password: {secret: ssh/password}
