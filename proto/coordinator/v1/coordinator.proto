syntax = "proto3";

package coordinator.v1;

// protolint:disable:next MAX_LINE_LENGTH
option go_package = "github.com/dagucloud/dagu/v2/proto/coordinator/v1;coordinatorv1";


// Service definition for Coordinator Service.
service CoordinatorService {
  // Poll is called by workers to process a task.
  rpc Poll (PollRequest) returns (PollResponse);
  // Dispatch is called to dispatch a task to a worker.
  rpc Dispatch (DispatchRequest) returns (DispatchResponse);
  // GetWorkers returns the list of connected workers and their pollers.
  rpc GetWorkers (GetWorkersRequest) returns (GetWorkersResponse);
  // GetH2CCallers lists the hosts, other than workers, that called the
  // coordinator over h2c in the last 10 minutes.
  rpc GetH2CCallers (GetH2CCallersRequest) returns (GetH2CCallersResponse);
  // Heartbeat is called by workers to report their status.
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
  // AckTaskClaim is called by workers after accepting a claimed task.
  rpc AckTaskClaim (AckTaskClaimRequest) returns (AckTaskClaimResponse);
  // ClaimAgentSessionCleanup reserves provider cleanup for its owning worker.
  rpc ClaimAgentSessionCleanup (ClaimAgentSessionCleanupRequest) returns (ClaimAgentSessionCleanupResponse);
  // CompleteAgentSessionCleanup completes or releases a provider cleanup claim.
  rpc CompleteAgentSessionCleanup (CompleteAgentSessionCleanupRequest) returns (CompleteAgentSessionCleanupResponse);
  // RunHeartbeat is called by workers to refresh leases for tasks owned by a
  // specific coordinator instance.
  rpc RunHeartbeat (RunHeartbeatRequest) returns (RunHeartbeatResponse);

  // ReportStatus is called by workers to push DAG run status updates.
  rpc ReportStatus (ReportStatusRequest) returns (ReportStatusResponse);

  // StreamLogs is called by workers to stream step logs to the coordinator.
  // Uses client streaming for efficient log transmission.
  rpc StreamLogs (stream LogChunk) returns (StreamLogsResponse);

  // StreamArtifacts is called by workers to upload DAG run artifacts to the coordinator.
  // Uses client streaming for efficient file transmission.
  rpc StreamArtifacts (stream ArtifactChunk) returns (StreamArtifactsResponse);

  // PutWorkspaceBundle uploads an immutable content-addressed workspace bundle.
  rpc PutWorkspaceBundle (stream WorkspaceBundleChunk) returns (PutWorkspaceBundleResponse);

  // HasWorkspaceBundle checks whether a coordinator already stores a bundle.
  rpc HasWorkspaceBundle (HasWorkspaceBundleRequest) returns (HasWorkspaceBundleResponse);

  // GetWorkspaceBundle downloads an immutable content-addressed workspace bundle.
  rpc GetWorkspaceBundle (GetWorkspaceBundleRequest) returns (stream WorkspaceBundleChunk);

  // GetDAGRunStatus retrieves the status of a DAG run from the coordinator.
  // Used by parent DAGs to poll status of remote sub-DAGs.
  rpc GetDAGRunStatus (GetDAGRunStatusRequest) returns (GetDAGRunStatusResponse);

  // RequestCancel is called to request cancellation of a DAG run.
  // Used for sub-DAG cancellation where the parent cannot directly access the
  // sub-DAG's attempt.
  rpc RequestCancel (RequestCancelRequest) returns (RequestCancelResponse);

  // GetState retrieves persistent DAG state from the coordinator-owned store.
  rpc GetState (GetStateRequest) returns (GetStateResponse);

  // PutState creates or updates persistent DAG state with optimistic concurrency.
  rpc PutState (PutStateRequest) returns (PutStateResponse);

  // DeleteState removes persistent DAG state.
  rpc DeleteState (DeleteStateRequest) returns (DeleteStateResponse);

  // ListState lists persistent DAG state entries by scope, namespace, and key prefix.
  rpc ListState (ListStateRequest) returns (ListStateResponse);

  // GetDAG retrieves a DAG definition (raw YAML spec) from the coordinator's DAG store.
  // Used as a fallback when a worker's local DAG store misses a definition during
  // sub-DAG execution.
  rpc GetDAG (GetDAGRequest) returns (GetDAGResponse);

  // ResolveSecretReference resolves or checks a Dagu-managed secret registry ref.
  // Used by workers that cannot read the coordinator's secret store.
  rpc ResolveSecretReference (ResolveSecretReferenceRequest) returns (ResolveSecretReferenceResponse);

  // ResolveRuntimeProfile resolves inherited and selected runtime profile layers.
  rpc ResolveRuntimeProfile (ResolveRuntimeProfileRequest) returns (ResolveRuntimeProfileResponse);

  // ResolveNodes answers the nodes a run on a worker targets, the nodes they
  // connect through, and the host keys trusted for them. Credentials appear
  // as secret refs, never as values.
  rpc ResolveNodes (ResolveNodesRequest) returns (ResolveNodesResponse);

  // ResolveConnectionToken answers the access token of a connection that a
  // run on a worker declares, with the connection's binding, or with
  // check_only the binding alone. Used by workers that cannot read the
  // coordinator's connection store.
  rpc ResolveConnectionToken (ResolveConnectionTokenRequest) returns (ResolveConnectionTokenResponse);

  // GetJoinReadiness reports, from the coordinator's own host, whether a
  // worker on another host can join it. It takes the peer token.
  rpc GetJoinReadiness (GetJoinReadinessRequest) returns (GetJoinReadinessResponse);

  // CreateInvite creates an invite that lets workers enroll for a worker
  // certificate. Only its response contains the invite. It takes the peer
  // token.
  rpc CreateInvite (CreateInviteRequest) returns (CreateInviteResponse);

  // ListInvites lists the invites without their secrets. It takes the peer
  // token.
  rpc ListInvites (ListInvitesRequest) returns (ListInvitesResponse);

  // DeleteInvite deletes an invite, so it enrolls no further worker. It
  // takes the peer token.
  rpc DeleteInvite (DeleteInviteRequest) returns (DeleteInviteResponse);

  // Enroll issues a worker certificate for the key of a certificate signing
  // request, admitted by an invite. It needs built-in TLS and no peer token.
  rpc Enroll (EnrollRequest) returns (EnrollResponse);
}

// Request message for polling a task.
message PollRequest {
  string worker_id = 1;
  string poller_id = 2; // Unique ID for this poll request
  map<string, string> labels = 3; // Worker labels for task matching
  // The worker asks for connection tokens through ResolveConnectionToken,
  // so it may run a DAG that declares connections.
  bool connection_tokens = 4;
}

// Response message for polling a task.
message PollResponse {
  Task task = 1; // The task to process.
}

// Request message for dispatching a task.
message DispatchRequest {
  Task task = 1;
  string admission_reservation_token = 2;
}

// Response message for dispatching a task.
message DispatchResponse {
  // No field
}

// Task to process.
message Task {
  Operation operation = 6;
  string root_dag_run_name = 1;
  string root_dag_run_id = 2;
  string parent_dag_run_name = 3;
  string parent_dag_run_id = 4;
  string dag_run_id = 5;
  string target = 7; // DAG name or path
  string params = 8; // Optional: parameters
  string step = 9;   // Optional: specific step (for RETRY)
  map<string, string> worker_selector = 10; // Required worker labels for execution
  string definition = 11; // Optional: DAG definition (YAML) for local DAGs
  string worker_id = 12; // ID of the worker that will execute this task
  // Previous status for OPERATION_RETRY.
  // When set, workers can retry without needing local DAG-run persistence.
  DAGRunStatusProto previous_status = 13;
  // Attempt ID created by coordinator. Workers use this to create attempts with the same ID.
  string attempt_id = 14;
  // Globally unique attempt identifier for cancellation tracking.
  string attempt_key = 15;
  // Additional labels (comma-separated key=value or key-only) to apply to the DAG run.
  string labels = 16;
  // Base config YAML content for workers (avoids relying on local base config files).
  string base_config = 17;
  // RFC 3339 timestamp of when this task was originally scheduled.
  string schedule_time = 18;
  // Enables parent-managed step retries for this task.
  bool external_step_retry = 19;
  // Queue/proc-group name used for distributed queue capacity accounting.
  string queue_name = 20;
  // Coordinator instance that owns this task after claim.
  string owner_coordinator_id = 21;
  string owner_coordinator_host = 22;
  int32 owner_coordinator_port = 23;
  // Durable token identifying the shared task claim.
  string claim_token = 24;
  // Original DAG file path for provenance-aware reschedule-from-file behavior.
  string source_file = 25;
  // Content-addressed workspace bundle for action sub-DAGs.
  string workspace_bundle_digest = 27;
  int64 workspace_bundle_size = 28;
  string workspace_bundle_dag_path = 29;
  string workspace_bundle_original_ref = 30;
  string workspace_bundle_resolved_ref = 31;
  // Runtime profile name. Workers resolve values at attempt start.
  string profile_name = 32;
  // Internal persisted child DAG route for a targeted step retry.
  string retry_path = 33;
  // Attributable actor that initiated the DAG run.
  string trigger_actor = 34;
  // Stable identity of the persisted DAG definition.
  string definition_id = 35;
  // Value bound to ITEM for a parallel child run.
  string parallel_item = 36;
  // Exact worker required to resume a host-owned agent session.
  string target_worker_id = 37;
  // When true, a targeted step retry also resets reachable descendants.
  bool include_downstream = 38;
  // Workspace supplying base configuration; empty selects global configuration.
  optional string base_config_workspace = 39;
  // When true, steps selected by a targeted retry skip their preconditions.
  bool bypass_preconditions = 40;
  // Resolved "KEY=value" pairs the parent opted to share with the child run via
  // the step's pass_env field.
  repeated string passed_envs = 41;
  // How the DAG run was initiated. Workers record this on a started run.
  string trigger_type = 42;
  // Window the slot at schedule_time owns: RFC 3339 bounds and the zone of
  // the slot's schedule. Empty when unknown.
  string interval_start = 43;
  string next_scheduled_at = 44;
  string schedule_timezone = 45;
  // The run's dates as JSON, resolved when the run was created. Empty when
  // the run resolves them as it starts.
  string dates_json = 46;
  // Node names the run is narrowed to (RFC 013). Empty when not narrowed.
  repeated string target_nodes = 47;
  // Node the run is bound to (RFC 013): a worker node, whose run is
  // dispatched to that worker by target_worker_id.
  string bound_node = 48;
  // Command step with nodes of the definition that the run runs alone, bound
  // to bound_node. Empty for a run of the whole definition.
  string node_step = 49;
  // Set by the coordinator when the definition declares connections, so
  // only a worker that sets PollRequest.connection_tokens claims the task.
  bool needs_connection_tokens = 50;
}

enum Operation {
  OPERATION_UNSPECIFIED = 0;
  OPERATION_START = 1;    // Start a new DAG run
  OPERATION_RETRY = 2;    // Retry an existing run
}

// Health status of a worker based on heartbeat recency.
enum WorkerHealthStatus {
  WORKER_HEALTH_STATUS_UNSPECIFIED = 0;
  WORKER_HEALTH_STATUS_HEALTHY = 1;      // Last heartbeat < 5 seconds
  WORKER_HEALTH_STATUS_WARNING = 2;      // Last heartbeat 5-15 seconds
  WORKER_HEALTH_STATUS_UNHEALTHY = 3;    // Last heartbeat > 15 seconds
}

// Request message for getting workers.
message GetWorkersRequest {
  // No fields needed for now
}

// Response message for getting workers.
message GetWorkersResponse {
  repeated WorkerInfo workers = 1;
}

// Information about a worker and its pollers.
message WorkerInfo {
  string worker_id = 1;
  string poller_id = 2;  // Deprecated: Only used for backward compatibility
  map<string, string> labels = 3;
  int64 connected_at = 4; // Unix timestamp in seconds
  // Aggregated stats from heartbeat
  int32 total_pollers = 5;
  int32 busy_pollers = 6;
  repeated RunningTask running_tasks = 7;
  int64 last_heartbeat_at = 8; // Unix timestamp of last heartbeat
  WorkerHealthStatus health_status = 9; // Health status based on heartbeat recency
  string version = 10; // Dagu version the worker runs; empty when it reports none
  // How the worker's last heartbeat reached the coordinator.
  WorkerConnection connection = 11;
  // Why a plaintext worker uses h2c: peer.insecure, no TLS source, tls
  // failed on the network path, or older version. Empty otherwise.
  string plaintext_reason = 12;
}

// How a worker's heartbeat reaches the coordinator.
enum WorkerConnection {
  WORKER_CONNECTION_UNSPECIFIED = 0;  // Not recorded, as by an older coordinator
  WORKER_CONNECTION_CERTIFICATE = 1;  // TLS with a worker certificate
  WORKER_CONNECTION_TLS = 2;          // TLS without a worker certificate
  WORKER_CONNECTION_PLAINTEXT = 3;    // h2c
}

message GetH2CCallersRequest {
}

message GetH2CCallersResponse {
  repeated H2CCaller callers = 1;
}

// A host that called the coordinator over h2c, with one reason.
message H2CCaller {
  string host = 1;          // Remote host, without the port
  string reason = 2;        // As WorkerInfo.plaintext_reason
  int64 last_call_at = 3;   // Unix timestamp in seconds of its last call
}

// Request message for heartbeat.
message HeartbeatRequest {
  string worker_id = 1;
  map<string, string> labels = 2;
  WorkerStats stats = 3;
  string host = 4;            // Name of the machine the worker runs on
  MachineSample machine = 5;  // Unset until the worker samples its machine
  string version = 6;         // Dagu version the worker runs
  bool connection_tokens = 7; // As PollRequest.connection_tokens
}

// A reading of the resources of the machine a worker runs on, or of its
// container when the container has limits. An unset part failed to read.
message MachineSample {
  int32 cpus = 1;        // Logical CPUs of the machine
  double cpu_limit = 2;  // CPUs the container may use; 0 without a limit
  // CPU use from 0 to 100 of cpu_limit when set, averaged over the last
  // minute, and the highest sample in that minute.
  optional double cpu_percent = 3;
  optional double cpu_peak_percent = 4;
  MachineUsage memory = 5;
  MachineUsage disk = 6;      // Disk holding the data directory
  MachineUsage log_disk = 7;  // Disk holding the log directory, when another
  MachineLoad load = 8;
}

// How much of a memory or a disk is in use.
message MachineUsage {
  double used_percent = 1;
  uint64 used_bytes = 2;
  uint64 total_bytes = 3;
  bool limited = 4;  // Memory counted against a container's limit
  optional double inodes_used_percent = 5;
}

// System load averaged over 1, 5, and 15 minutes.
message MachineLoad {
  double load1 = 1;
  double load5 = 2;
  double load15 = 3;
}

// Response message for heartbeat.
message HeartbeatResponse {
  // List of DAG runs that should be cancelled by the worker.
  // Workers check this on each heartbeat and cancel matching running tasks.
  repeated CancelledRun cancelled_runs = 1;
}

message AckTaskClaimRequest {
  string worker_id = 1;
  string claim_token = 2;
  string attempt_key = 3;
}

message AckTaskClaimResponse {
  bool accepted = 1;
  string error = 2;
}

message ClaimAgentSessionCleanupRequest {
  string worker_id = 1;
}

message ClaimAgentSessionCleanupResponse {
  bool found = 1;
  string job_id = 2;
  string claim_token = 3;
  string provider = 4;
  string session_id = 5;
  string directory = 6;
  string owner_coordinator_id = 7;
  string owner_coordinator_host = 8;
  int32 owner_coordinator_port = 9;
}

message CompleteAgentSessionCleanupRequest {
  string worker_id = 1;
  string job_id = 2;
  string claim_token = 3;
  string error = 4;
}

message CompleteAgentSessionCleanupResponse {
  // No fields.
}

message RunHeartbeatRequest {
  string worker_id = 1;
  string owner_coordinator_id = 2;
  repeated RunningTask running_tasks = 3;
}

message RunHeartbeatResponse {
  repeated CancelledRun cancelled_runs = 1;
}

// Information about a cancelled DAG run.
message CancelledRun {
  string attempt_key = 1; // Globally unique attempt identifier to cancel
}

// Worker statistics reported via heartbeat.
message WorkerStats {
  int32 total_pollers = 1;      // Total number of pollers
  int32 busy_pollers = 2;       // Number currently processing tasks
  repeated RunningTask running_tasks = 3; // Details of running tasks
}

// Information about a running task.
message RunningTask {
  string dag_run_id = 1;
  string dag_name = 2;
  int64 started_at = 3;         // Unix timestamp in seconds
  string root_dag_run_name = 4;
  string root_dag_run_id = 5;
  string parent_dag_run_name = 6;
  string parent_dag_run_id = 7;
  string attempt_key = 8;       // Globally unique attempt identifier
}

// Request message for reporting DAG run status.
message ReportStatusRequest {
  string worker_id = 1;
  DAGRunStatusProto status = 2;
  string owner_coordinator_id = 3;
  string source_file = 4;
  string labels = 5;
}

// Response message for reporting DAG run status.
message ReportStatusResponse {
  bool accepted = 1;
  string error = 2;
}

// Full DAG run status (JSON-serialized execution.DAGRunStatus).
message DAGRunStatusProto {
  string json_data = 1;
}

// Log chunk sent from worker to coordinator.
message LogChunk {
  string worker_id = 1;
  string dag_run_id = 2;
  string dag_name = 3;
  string step_name = 4;
  LogStreamType stream_type = 5;
  bytes data = 6;
  uint64 sequence = 7;  // For ordering
  bool is_final = 8;    // Last chunk for this step

  // Root DAG info for sub-DAGs
  string root_dag_run_name = 9;
  string root_dag_run_id = 10;

  // Attempt ID for the DAG run
  string attempt_id = 11;
  // Owner coordinator used to validate owner-bound log writes.
  string owner_coordinator_id = 12;
  // Durable attempt identity used to fence log writes.
  string attempt_key = 13;
  // When present, data is written at this absolute byte position; otherwise it is appended.
  optional uint64 byte_offset = 14;
}

// Type of log stream.
enum LogStreamType {
  LOG_STREAM_TYPE_UNSPECIFIED = 0;
  LOG_STREAM_TYPE_STDOUT = 1;
  LOG_STREAM_TYPE_STDERR = 2;
  LOG_STREAM_TYPE_SCHEDULER = 3;  // Scheduler/DAG run log
}

// Response message for log streaming.
message StreamLogsResponse {
  uint64 chunks_received = 1;
  uint64 bytes_written = 2;
  string error = 3;
}

// Artifact chunk sent from worker to coordinator.
message ArtifactChunk {
  string worker_id = 1;
  string dag_run_id = 2;
  string dag_name = 3;
  string relative_path = 4;
  bytes data = 5;
  uint64 sequence = 6;
  bool is_final = 7;

  // Root DAG info for sub-DAGs
  string root_dag_run_name = 8;
  string root_dag_run_id = 9;

  // Attempt ID for the DAG run
  string attempt_id = 10;
  // Owner coordinator used to validate owner-bound artifact writes.
  string owner_coordinator_id = 11;
  // Durable attempt identity used to fence artifact writes.
  string attempt_key = 12;
}

// Response message for artifact streaming.
message StreamArtifactsResponse {
  uint64 chunks_received = 1;
  uint64 bytes_written = 2;
  string error = 3;
}

// Workspace bundle descriptor.
message WorkspaceBundle {
  string digest = 1;
  int64 size = 2;
  string dag_path = 3;
  string original_ref = 4;
  string resolved_ref = 5;
}

// Workspace bundle chunk for upload and download streams.
message WorkspaceBundleChunk {
  WorkspaceBundle bundle = 1;
  bytes data = 2;
  uint64 sequence = 3;
  bool is_final = 4;
}

// Response message for workspace bundle upload.
message PutWorkspaceBundleResponse {
  bool accepted = 1;
  string error = 2;
}

// Request message for checking workspace bundle presence.
message HasWorkspaceBundleRequest {
  string digest = 1;
}

// Response message for checking workspace bundle presence.
message HasWorkspaceBundleResponse {
  bool exists = 1;
}

// Request message for workspace bundle download.
message GetWorkspaceBundleRequest {
  string digest = 1;
}

// Request message for getting DAG run status.
message GetDAGRunStatusRequest {
  string dag_name = 1;      // Name of the DAG
  string dag_run_id = 2;    // ID of the DAG run
  // Root DAG run info for sub-DAG queries (optional).
  // When set, the coordinator looks up the status as a sub-DAG.
  string root_dag_run_name = 3;
  string root_dag_run_id = 4;
}

// Response message for getting DAG run status.
message GetDAGRunStatusResponse {
  bool found = 1;                   // Whether the DAG run was found
  DAGRunStatusProto status = 2;     // The status (only set if found)
  string error = 3;                 // Error message if any
}

// Request message for cancelling a DAG run.
message RequestCancelRequest {
  string dag_name = 1;
  string dag_run_id = 2;
  // Root DAG run info for sub-DAG cancellation
  string root_dag_run_name = 3;
  string root_dag_run_id = 4;
}

// Response message for cancelling a DAG run.
message RequestCancelResponse {
  bool accepted = 1;
  string error = 2;
}

message StateRef {
  string scope = 1;
  string namespace = 2;
  string key = 3;
}

message StateUpdateSource {
  string dag_name = 1;
  string dag_run_id = 2;
  string attempt_id = 3;
  string step_name = 4;
}

message StateEntry {
  StateRef ref = 1;
  bytes value = 2;
  int64 version = 3;
  string hash = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
  StateUpdateSource updated_by = 7;
}

message GetStateRequest {
  StateRef ref = 1;
}

message GetStateResponse {
  bool found = 1;
  StateEntry entry = 2;
}

message PutStateRequest {
  StateRef ref = 1;
  bytes value = 2;
  bool has_expected_version = 3;
  int64 expected_version = 4;
  bool create_only = 5;
  StateUpdateSource updated_by = 6;
}

message PutStateResponse {
  StateEntry entry = 1;
}

message DeleteStateRequest {
  StateRef ref = 1;
}

message DeleteStateResponse {
  bool deleted = 1;
}

message ListStateRequest {
  string scope = 1;
  string namespace = 2;
  string key_prefix = 3;
  int32 limit = 4;
}

message ListStateResponse {
  repeated StateEntry entries = 1;
}

// GetDAG retrieves a DAG definition (raw YAML spec) from the coordinator's DAG store.
// Used as a fallback when a worker's local DAG store misses a definition during
// sub-DAG execution. This eliminates race conditions in git-synced setups where
// a new DAG YAML may not yet be present on the worker.
message GetDAGRequest {
  string name = 1;  // DAG name to look up
}

message GetDAGResponse {
  string spec = 1;  // Raw YAML content of the DAG definition (empty if not found)
  string error = 2; // Error description when the DAG cannot be retrieved
}

// ResolveSecretReference resolves or checks one Dagu-managed registry ref.
message ResolveSecretReferenceRequest {
  string name = 1;      // Environment variable name requested by the DAG
  string ref = 2;       // Registry ref, for example "prod/db-password"
  string workspace = 3; // Workspace scope; empty means global
  bool check_only = 4;  // When true, verify access without returning plaintext
  string worker_id = 5;   // Worker currently owning the dispatched attempt
  string attempt_key = 6; // Active distributed attempt lease key
  string attempt_id = 7;  // Attempt ID created by the coordinator
  string dag_name = 8;    // Current DAG definition; empty keeps legacy root behavior
  // Node whose connection uses ref, set in place of name. The ref is served
  // only to an attempt that targets nodes.
  string node = 9;
}

message ResolveSecretReferenceResponse {
  string value = 1; // Plaintext secret value; empty for check_only
}

message ResolveRuntimeProfileRequest {
  string worker_id = 1;
  string attempt_key = 2;
  string attempt_id = 3;
  string profile_name = 4;
  string workspace = 5;
  string dag_name = 6;
}

message RuntimeProfileEntry {
  string key = 1;
  string kind = 2;
  string value = 3;
}

message RuntimeProfileLayer {
  string name = 1;
  repeated RuntimeProfileEntry entries = 2;
}

message ResolveRuntimeProfileResponse {
  RuntimeProfileLayer defaults = 1;
  RuntimeProfileLayer selected = 2;
}

// ResolveConnectionTokenRequest names a connection that the DAG of an
// attempt the worker holds declares.
message ResolveConnectionTokenRequest {
  string worker_id = 1;   // Worker currently owning the dispatched attempt
  string attempt_key = 2; // Active distributed attempt lease key
  string attempt_id = 3;  // Attempt ID created by the coordinator
  string dag_name = 4;    // Current DAG definition; empty selects the attempt's DAG
  string connection = 5;  // Connection name, resolved in the DAG's workspace
  // When true, run the admission checks and answer the binding without a
  // token.
  bool check_only = 6;
  string resource = 7;         // Resource the token is for; empty selects the only one
  int64 min_ttl_seconds = 8;   // Least lifetime the token keeps
  // Token that the resource rejected. The coordinator refreshes only while
  // it is still the stored token.
  string rejected_token = 9;
}

message ResolveConnectionTokenResponse {
  string access_token = 1;       // Empty for check_only
  int64 expires_in_seconds = 2;  // Lifetime left; 0 when the token reports no expiry
  ConnectionBinding binding = 3;
}

// ConnectionBinding is what a worker needs to use a connection's token: the
// hosts that may receive it, the services it serves, and whether a step may
// receive it in its environment.
message ConnectionBinding {
  string provider = 1;
  repeated ConnectionService services = 2;
  repeated string bound_hosts = 3; // Every host that may receive the token
  string resource = 4;             // Canonical server URL of an MCP connection
  bool allow_token_export = 5;     // A connection secret may export the token
  string account = 6;              // Account the connection acts as; empty before its first connect and in a check-only answer
}

message ConnectionService {
  string name = 1;
  string access = 2; // "read" or "write"
}

// ResolveNodesRequest names the nodes a run on a worker targets, by a
// selector or by exact names, never both.
message ResolveNodesRequest {
  string worker_id = 1;   // Worker currently owning the dispatched attempt
  string attempt_key = 2; // Active distributed attempt lease key
  string attempt_id = 3;  // Attempt ID created by the coordinator
  string dag_name = 4;    // Current DAG definition; empty selects the attempt's DAG
  string selector = 5;    // Label selector, such as "role=web,!canary"
  repeated string names = 6; // Exact node names, compared without case
}

message ResolveNodesResponse {
  // Nodes the selector matches or the names name, in name order. A name
  // that names no node is left out.
  repeated ResolvedNode nodes = 1;
  // Each node that a node above connects through, once, in name order.
  repeated ResolvedNode bastions = 2;
  // Host keys trusted for the nodes and bastions above.
  repeated TrustedHostKey trusted_host_keys = 3;
}

// How Dagu reaches a node.
enum NodeKind {
  NODE_KIND_UNSPECIFIED = 0;
  NODE_KIND_SSH = 1; // A host of an inventory
  NODE_KIND_WORKER = 2; // A worker that sets worker.id; it has a name, host, and labels only
}

// A node with its inventory's defaults applied, or a worker node, which sets
// name, kind, host, and labels only. A credential is a key path or a secret
// ref, never a secret value.
message ResolvedNode {
  string name = 1;
  NodeKind kind = 2;
  string inventory_id = 3;
  string inventory_name = 4;
  string host = 5;
  int32 port = 6;
  string user = 7;
  string key_path = 8;
  string key_secret = 9;
  string password_secret = 10;
  string passphrase_secret = 11;
  string bastion = 12;           // Node of the same inventory to connect through
  string host_key = 13;          // Pinned public key in authorized_keys form
  bool strict_host_key = 14;
  string shell = 15;
  int64 timeout_nanos = 16;      // Connect timeout in nanoseconds
  repeated string labels = 17;   // "key" or "key=value"
  string description = 18;
  bool disabled = 19;
}

// A host key a user trusted for a node.
message TrustedHostKey {
  string node = 1;
  string key = 2;         // Public key in authorized_keys form
  string fingerprint = 3; // SHA256 fingerprint
}

message GetJoinReadinessRequest {
}

// The join readiness of one coordinator, as Spec 108 defines it.
message GetJoinReadinessResponse {
  string listen_host = 1;  // coordinator.host
  int32 port = 2;          // coordinator.port
  // The config file the coordinator read, or the default path it would read.
  string config_file = 3;
  // True when coordinator.host is localhost, an address in 127.0.0.0/8, or [::1].
  bool loopback_only = 4;
  ConfigSource host_source = 5;  // Where coordinator.host came from
  string advertise = 6;          // coordinator.advertise when set explicitly
  HostEnvironment environment = 7;
  // Addresses a worker on another host may dial, when environment is
  // HOST_ENVIRONMENT_HOST: the interface addresses other than loopback and
  // link-local ones for a listener on all interfaces, or listen_host when it
  // is another IP address that is not loopback. Empty otherwise.
  repeated string addresses = 8;
  bool builtin_tls = 9;  // True only when the coordinator has a usable peer CA
  bool ready = 10;       // True when loopback_only is false and builtin_tls is true
  // Why builtin_tls is false; unspecified when it is true.
  BuiltinTLSReason builtin_tls_reason = 11;
}

// Why a coordinator has no built-in TLS.
enum BuiltinTLSReason {
  BUILTIN_TLS_REASON_UNSPECIFIED = 0;
  BUILTIN_TLS_REASON_OWN_CERTIFICATES = 1;  // peer.cert_file and peer.key_file are set
  BUILTIN_TLS_REASON_CA_UNAVAILABLE = 2;    // The generated CA could not be created or read
}

// Where a configuration value came from.
message ConfigSource {
  ConfigSourceKind kind = 1;
  // The config file path, the environment variable, or the flag, such as
  // "--coordinator.host". Empty for a default.
  string name = 2;
}

enum ConfigSourceKind {
  CONFIG_SOURCE_KIND_UNSPECIFIED = 0;
  CONFIG_SOURCE_KIND_DEFAULT = 1;
  CONFIG_SOURCE_KIND_FILE = 2;
  CONFIG_SOURCE_KIND_ENV = 3;
  CONFIG_SOURCE_KIND_FLAG = 4;
}

// Where a Dagu process runs.
enum HostEnvironment {
  HOST_ENVIRONMENT_UNSPECIFIED = 0;
  HOST_ENVIRONMENT_HOST = 1;        // Neither of the below
  HOST_ENVIRONMENT_CONTAINER = 2;   // /.dockerenv or /run/.containerenv exists
  HOST_ENVIRONMENT_KUBERNETES = 3;  // KUBERNETES_SERVICE_HOST is set
}

message CreateInviteRequest {
  bool reusable = 1;  // True for an invite that enrolls any number of workers
  // Seconds until the invite ends, or 0 for the default: 24 hours for a
  // single-use invite, none for a reusable one.
  int64 expires_in_seconds = 2;
  string address = 3;     // The host:port the invite is made for, or empty
  string created_by = 4;  // The user who asked for it, or empty for the peer token
}

message CreateInviteResponse {
  string invite = 1;  // dagu1.<pin>.<secret>
  InviteRecord record = 2;
}

message ListInvitesRequest {
}

message ListInvitesResponse {
  repeated InviteRecord invites = 1;  // Oldest first
}

message DeleteInviteRequest {
  string id = 1;
}

message DeleteInviteResponse {
}

// An invite's record. It never holds the invite or its secret.
message InviteRecord {
  string id = 1;
  InviteKind kind = 2;
  int64 expires_at = 3;  // Unix timestamp in seconds, or 0 for none
  string address = 4;    // The host:port the invite was made for, or empty
  string created_by = 5; // The user, or "peer token"
  int64 created_at = 6;  // Unix timestamp in seconds
  int32 use_count = 7;   // The number of enrollments it admitted
  int64 last_used_at = 8; // Unix timestamp in seconds, or 0 before the first use
}

enum InviteKind {
  INVITE_KIND_UNSPECIFIED = 0;
  INVITE_KIND_SINGLE_USE = 1;  // Enrolls one worker
  INVITE_KIND_REUSABLE = 2;    // Enrolls any number of workers
}

message EnrollRequest {
  string invite = 1;  // dagu1.<pin>.<secret>
  bytes csr = 2;      // DER certificate signing request for the worker's key
  string worker_id = 3;
  string host = 4;    // The worker's host name
  // True when the worker keeps its certificate across restarts. A
  // single-use invite enrolls only such a worker.
  bool keeps_certificate = 5;
}

message EnrollResponse {
  bytes certificate = 1;     // DER worker certificate
  bytes ca_certificate = 2;  // DER peer CA certificate
}
