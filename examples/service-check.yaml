# A service DAG: the scheduler starts a new run 1 second after each run ends.
# The check fails about one time in ten, so the run history shows failed and
# recovered events. Open the DAG in the web UI to see its history.
restart_policy: always
restart_wait_sec: 1
steps:
  - id: check
    run: awk 'BEGIN { srand(); exit (rand() < 0.1) }'
