# A workflow that an HTTP call starts. Create its webhook in the workflow page
# (Webhook tab); the Active column of the list switches the webhook on and off.
# The order ID comes from the request payload, such as
# {"payload": {"order_id": "A-1001"}}. A run started by hand uses the param.
description: Receive an order from a webhook and record it.
type: chain
params:
  - WEBHOOK_PAYLOAD: '{"order_id": "manual"}'
steps:
  - name: receive
    action: jq.filter
    with:
      data: ${params.WEBHOOK_PAYLOAD}
      filter: '.order_id // "unknown"'
      raw: true
    output: ORDER_ID
  - name: record
    run: echo "recorded order ${ORDER_ID}"
