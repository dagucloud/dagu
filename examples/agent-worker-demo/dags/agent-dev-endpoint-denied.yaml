description: >-
  A DAG that is not in the list "allow.dags" of the endpoint demo-upstream. The step code
  must fail at its start check with the reason endpoint_forbidden, and the CLI must not
  start. This is the negative test of the endpoint path.
type: graph
env:
  - FAKE_CLAUDE_SCENARIO: endpoint
steps:
  - id: code
    working_dir: .
    action: agent.run
    timeout_sec: 120
    with:
      endpoint:
        name: demo-upstream
        model: claude-demo
      provider: claude
      prompt: Say hello.
