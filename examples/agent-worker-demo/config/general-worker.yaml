# Dagu configuration of the general worker.
# Start: dagu worker --config /etc/dagu/config.yaml
peer:
  insecure: false
  skip_tls_verify: false
  cert_file: /etc/dagu/tls/general-worker.crt
  key_file: /etc/dagu/tls/general-worker.key
  client_ca_file: /etc/dagu/tls/ca.crt

worker:
  coordinators: [dagu-coordinator:50055]
  # The pool "general" allows the label role with any value.
  labels:
    role: general
