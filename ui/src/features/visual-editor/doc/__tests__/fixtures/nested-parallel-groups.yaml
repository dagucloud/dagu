name: ci   # parallel groups are nested arrays
steps:
  - name: prepare
    run: ./prepare.sh

  # Group 1: quality gates.
  - - name: lint
      run: make lint
    - name: unit
      run: make test
      # trailing comment inside the group item
    - echo shorthand inside the group

  # Group 2 has one item only.
  - - name: package
      run: make package
  - name: report
    run: ./report.sh
