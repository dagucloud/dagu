working_dir: .
env:
  - SHOP_URL: ${SHOP_URL}
  - LLM_BASE_URL: ${LLM_BASE_URL}
llm:
  provider: local
  model: test-model
  base_url: ${LLM_BASE_URL}
steps:
  - id: checkout
    action: browser.run
    with:
      url: ${SHOP_URL}
      browser:
        screenshots: final
      do:
        - act: Click the Place order button
          when: The page shows 'Cart has 2 items'
        - expect: {text: "Order confirmed"}
        - extract:
            instruction: The order number
            schema:
              type: object
              properties:
                order_number:
                  type: string
        - screenshot: confirmation
  - id: record
    depends: checkout
    run: |
      echo "${steps.checkout.outputs.order_number}" > order.out
      ls "$DAG_RUN_ARTIFACTS_DIR/browser/checkout" > shots.out
