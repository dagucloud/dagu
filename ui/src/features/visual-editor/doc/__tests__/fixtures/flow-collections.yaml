name: flow-collections
params: [ALPHA, BETA]
labels: {team: ops, tier: {name: gold, rank: 1}}
steps:
  - {name: inline, run: "echo inline", depends: []}
  - name: spaced
    depends: [ inline ]
    with: { method: GET,   url: "https://example.com/?a=1&b=2" }
  - name: long flow
    run: echo long
    env: [FIRST=1, SECOND=2, THIRD=3, FOURTH=4, FIFTH=5, SIXTH=6, SEVENTH=7, EIGHTH=8, NINTH=9, TENTH=10]
  - name: multiline flow
    run: echo multi
    with:
      items: [
        one,
        two,   # second
        three
      ]
      options: {
        a: 1,
        b: 2
      }
